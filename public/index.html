  goc(){const L=[['Góc có số đo 90° là góc gì?','Góc vuông',['Góc nhọn','Góc tù']],['Góc có số đo 180° là góc gì?','Góc bẹt',['Góc tù','Góc vuông']],['Góc có số đo 60° là góc gì?','Góc nhọn',['Góc tù','Góc bẹt']],['Góc có số đo 120° là góc gì?','Góc tù',['Góc nhọn','Góc vuông']],['Góc tù là góc như thế nào?','Lớn hơn góc vuông, bé hơn góc bẹt',['Bé hơn góc vuông','Bằng góc vuông']]];const[q,a,w]=pick(L);return mc('hinhhoc',q,a,w);},
  hinhHoc(){const L=[['Hình bình hành có đặc điểm gì?','Hai cặp cạnh đối diện song song và bằng nhau',['Bốn góc vuông','Chỉ có một cặp cạnh song song']],['Hình thoi có đặc điểm gì?','Hai cặp cạnh đối diện song song và bốn cạnh bằng nhau',['Bốn góc vuông và các cạnh không bằng nhau','Chỉ có ba cạnh']],['Hai đường thẳng vuông góc tạo thành mấy góc vuông?','4 góc vuông',['2 góc vuông','1 góc vuông']],['Hình chữ nhật có mấy cặp cạnh song song?','2 cặp',['1 cặp','4 cặp']]];const[q,a,w]=pick(L);return mc('hinhhoc',q,a,w);},
  doiDV(){const L=[()=>{const t=rnd(2,9);return[`${t} tấn = ? kg`,t*1000];},()=>{const t=rnd(2,9);return[`${t} tạ = ? kg`,t*100];},()=>{const y=rnd(2,9);return[`${y} yến = ? kg`,y*10];},()=>{const m=rnd(2,9);return[`${m} m² = ? dm²`,m*100];},()=>{const d=rnd(2,9);return[`${d} dm² = ? cm²`,d*100];},()=>{const p=rnd(2,5);return[`${p} phút = ? giây`,p*60];},()=>{const t=rnd(2,5);return[`${t} thế kỉ = ? năm`,t*100];},()=>{const t=rnd(2,9),k=rnd(1,9)*10;return[`${t} tạ ${k} kg = ? kg`,t*100+k];}];const[e,a]=pick(L)();return inp('doluong','Điền số thích hợp:',a,{big:e,bigSmall:true,explain:'1 tấn = 10 tạ = 100 yến = 1000 kg; 1 m² = 100 dm²; 1 dm² = 100 cm²; 1 phút = 60 giây; 1 thế kỉ = 100 năm.'});},
  theKi(){const y=pick([1945,2000,1975,2026,1010,1802,2001]);const c=Math.ceil(y/100);return inp('doluong',`Năm ${y} thuộc thế kỉ thứ mấy? (viết số)`,c,{explain:`Thế kỉ ${c} gồm các năm từ ${(c-1)*100+1} đến ${c*100}.`});},
  tbc(){const n=pick([3,4]);const avg=rnd(20,60);const L=[];let s=0;for(let i=0;i<n-1;i++){const v=avg+rnd(-10,10);L.push(v);s+=v;}L.push(avg*n-s);return inp('thongke',`Tìm số trung bình cộng của các số: ${L.join('; ')}.`,avg,{explain:`(${L.join(' + ')}) : ${n} = ${avg*n} : ${n} = ${avg}`});},
  bieuDo(){const names=shuffle(['Lớp 4A','Lớp 4B','Lớp 4C','Lớp 4D']).slice(0,4);const v=names.map(()=>rnd(10,40));const vis=tableHTML(['Lớp',...names],[['Số cây trồng',...v.map(String)]]);const t=rnd(1,3);const iM=v.indexOf(Math.max(...v));
    if(t===1&&v.filter(x=>x===v[iM]).length===1)return mc('thongke','Quan sát bảng số liệu. Lớp nào trồng được nhiều cây nhất?',names[iM],names.filter((_,i)=>i!==iM),{visual:vis});
    if(t===2)return inp('thongke','Quan sát bảng số liệu. Trung bình mỗi lớp trồng được bao nhiêu cây? (làm tròn xuống nếu lẻ)',Math.floor(v.reduce((a,b)=>a+b,0)/4),{visual:vis,explain:`(${v.join(' + ')}) : 4`});
    return inp('thongke','Quan sát bảng số liệu. Cả bốn lớp trồng được bao nhiêu cây?',v.reduce((a,b)=>a+b,0),{visual:vis,explain:v.join(' + ')});},
  psCuaSo(){const b=pick([3,4,5,6]),a=rnd(1,b-1),k=rnd(3,12);const n=b*k;return inp('phanso',`Tìm ${fr(a,b)} của ${n}.`,a*k,{explain:`${n} × ${fr(a,b)} = ${n} : ${b} × ${a} = ${a*k}`});},
  tinhChat(){const a=rnd(12,48),b=rnd(2,9),c=10-b;return inp('nhanchia','Tính bằng cách thuận tiện:',a*10,{big:`${a} × ${b} + ${a} × ${c}`,bigSmall:true,explain:`${a} × (${b} + ${c}) = ${a} × 10 = ${a*10}`});},
  nhan10(){const a=rnd(12,999),k=pick([10,100,1000]);return Math.random()<.5?inp('nhanchia','Tính nhẩm:',a*k,{big:`${a} × ${k} = ?`}):inp('nhanchia','Tính nhẩm:',a,{big:`${fmtN(a*k)} : ${k} = ?`});},
  datCong(){const a=rnd(100000,600000),b=rnd(10000,399999);return inp('congtru','Đặt tính rồi tính:',a+b,{visual:colHTML(a,'+',b),read:`${a} cộng ${b}`,explain:`${fmtN(a)} + ${fmtN(b)} = ${fmtN(a+b)}`});},
  datTru(){const a=rnd(300000,999999),b=rnd(10000,a-50000);return inp('congtru','Đặt tính rồi tính:',a-b,{visual:colHTML(a,'−',b),read:`${a} trừ ${b}`,explain:`${fmtN(a)} − ${fmtN(b)} = ${fmtN(a-b)}`});},
  datNhan(){const a=rnd(102,999),b=rnd(12,68);return inp('nhanchia','Đặt tính rồi tính:',a*b,{visual:colHTML(a,'×',b),read:`${a} nhân ${b}`,explain:`${a} × ${b} = ${fmtN(a*b)}`});},
  datChia(){const b=rnd(12,48),q=rnd(21,199);return inp('nhanchia','Tính:',q,{big:`${fmtN(q*b)} : ${b} = ?`,bigSmall:true,explain:`${fmtN(q*b)} : ${b} = ${q}`});},
  congPS(){const t=rnd(1,4);let A,B,op,R;const b=rnd(3,9),a=rnd(1,b-1),c=rnd(1,b-1);
    if(t===1){op='+';R=frR(a+c,b);A=fr(a,b);B=fr(c,b);}else if(t===2){const x=Math.max(a,c),y=Math.min(a,c)||1;op='−';R=frR(x-y,b);A=fr(x,b);B=fr(y,b);if(x===y){A=fr(x+1,b);R=frR(1,b);}}else if(t===3){const k=rnd(2,4);op='+';A=fr(1,b);B=fr(1,b*k);R=frR(k+1,b*k);}else{const d=rnd(2,5);op='×';A=fr(a,b);B=fr(1,d);R=frR(a,b*d);}
    const [p,q]=R.includes('/')?R.split('/').map(Number):[+R,1];return mc4('phanso','Tính:',R,[fr(p+1,q),fr(p,q+1),q===1?fr(p,2):fr(q,p)].filter(x=>x!==R),{big:`${A} ${op} ${B} = ?`,explain:`Kết quả: ${R} (rút gọn nếu được).`});},
  tongHieu(){const a=rnd(30,200),b=rnd(10,a-5);const S=a+b,H=a-b;return inp('giaitoan',`Tổng của hai số là ${S}, hiệu của hai số là ${H}. Tìm số lớn.`,a,{explain:`Số lớn = (tổng + hiệu) : 2 = (${S} + ${H}) : 2 = ${a}. Số bé = ${b}.`});},
  loiVan(){const t=rnd(1,5);let text,ans,unit,ex,ic;
    if(t===1){const p=rnd(5,9)*1000,n=rnd(3,8),m=n+rnd(2,6);text=`Mua ${n} quyển vở hết ${fmtN(p*n)} đồng. Hỏi mua ${m} quyển vở như thế hết bao nhiêu tiền?`;ans=p*m;unit='đồng';ic='📒';ex=`Giá 1 quyển: ${fmtN(p*n)} : ${n} = ${fmtN(p)} (đồng)\n${m} quyển: ${fmtN(p)} × ${m} = ${fmtN(ans)} (đồng)`;}
    else if(t===2){const v=[rnd(30,60),rnd(30,60),rnd(30,60)];const s=v.reduce((a,b)=>a+b,0);const r=s%3;v[2]+=3-r===3?0:3-r;const S=v.reduce((a,b)=>a+b,0);text=`Ba bạn An, Bình, Chi lần lượt hái được ${v[0]} kg, ${v[1]} kg và ${v[2]} kg cam. Hỏi trung bình mỗi bạn hái được bao nhiêu ki-lô-gam cam?`;ans=S/3;unit='kg';ic='🍊';ex=`(${v.join(' + ')}) : 3 = ${S} : 3 = ${ans} (kg)`;}
    else if(t===3){const a=rnd(40,120),b=rnd(10,a-10);text=`Hai thửa ruộng thu được ${a+b} tạ thóc. Thửa thứ nhất thu được nhiều hơn thửa thứ hai ${a-b} tạ. Hỏi thửa thứ nhất thu được bao nhiêu tạ thóc?`;ans=a;unit='tạ';ic='🌾';ex=`(${a+b} + ${a-b}) : 2 = ${a} (tạ)`;}
    else if(t===4){const b=pick([3,4,5]),a=rnd(1,b-1),k=rnd(6,20);const n=b*k;text=`Lớp 4A có ${n} học sinh, trong đó ${fr(a,b)} số học sinh thích bóng đá. Hỏi lớp 4A có bao nhiêu học sinh thích bóng đá?`;ans=a*k;unit='học sinh';ic='⚽';ex=`${n} × ${fr(a,b)} = ${ans} (học sinh)`;}
    else{const w=rnd(8,20),k=rnd(2,3);const l=w*k;text=`Một mảnh vườn hình chữ nhật có chiều rộng ${w} m, chiều dài gấp ${k} lần chiều rộng. Tính diện tích mảnh vườn.`;ans=w*l;unit='m²';ic='🌱';ex=`Chiều dài: ${w} × ${k} = ${l} (m)\nDiện tích: ${l} × ${w} = ${ans} (m²)`;}
    return inp('giaitoan',text,ans,{unit,icon:ic,explain:`Bài giải\n${ex}\nĐáp số: ${fmtN(ans)} ${unit}.`});},
  nangCao(){const L=[()=>inp('so','Số chẵn lớn nhất có sáu chữ số khác nhau là số nào?',987654,{explain:'987 654'}),()=>inp('so','Có bao nhiêu số có ba chữ số?',900,{explain:'Từ 100 đến 999: 999 − 100 + 1 = 900 số.'}),

    ()=>mc4('phanso','Phân số nào bằng 3/4?','9/12',['6/9','3/8','4/3'],{explain:'3/4 = (3 × 3)/(4 × 3) = 9/12'}),()=>inp('nhanchia','Tính nhanh: 25 × 37 × 4',3700,{explain:'25 × 4 = 100; 100 × 37 = 3700.'}),
    ()=>inp('giaitoan','Một hình chữ nhật có chu vi 64 m, chiều dài hơn chiều rộng 8 m. Tính diện tích hình chữ nhật.',240,{unit:'m²',explain:'Nửa chu vi: 32 m. Dài: (32 + 8) : 2 = 20 m; rộng: 12 m; diện tích: 240 m².'})];return pick(L)();}
};

const EXM_M2=['ssPhanSo','rutGon','doiDV','theKi','tbc','bieuDo','psCuaSo','tinhChat','nhan10'];

function buildExamToan(k,adv){const rot=(arr,n,off)=>{const out=[];for(let i=0;i<n;i++)out.push(arr[(off+i*3)%arr.length]);return out;};
  const names=adv?[...rot(EXM_M2,3,k*2),...rot(EXM_TL,3,k*3+1),...rot(EXM_M3,6,k)]
    :[...rot(EXM_M1,4,k*2),...rot(EXM_M2,3,k*3),...rot(EXM_TL,5,k),rot(EXM_M3,1,k)[0]];
  const th=names.map(n=>()=>EXM[n]());return uniqList(th);}

function buildExamTv(k){const P=EXT[k%EXT.length];const passage={title:P.title,text:P.text};

const enWords=u=>EN_UNITS[u].w;
function enPicWords(us){return us.flatMap(u=>enWords(u)).filter(w=>w[1]&&w[1]!=='🔤');}
const EXE={
  listen(us){const W=us.flatMap(enWords);const w=pick(W);const o=shuffle(W.filter(x=>x[0]!==w[0])).slice(0,2).map(x=>x[0]);return mc('en_listen','Listen and choose the correct word.',w[0],o,{voice:[['en',w[0]]],auto:true,explain:`${w[0]} = ${w[2]}`});},
  listenSent(us){const C=us.flatMap(u=>EN_UNITS[u].c);const c=pick(C);const o=shuffle(C.filter(x=>x[0]!==c[0])).slice(0,2).map(x=>x[0]);return mc('en_listen','Listen and choose the correct sentence.',c[0],o,{voice:[['en',c[0]]],auto:true,explain:`${c[0]} = ${c[1]}`});},
  look(us){const W=enPicWords(us);const w=pick(W);const o=shuffle(W.filter(x=>x[0]!==w[0])).slice(0,2).map(x=>x[0]);return mc('en_vocab','Look and choose the correct word.',w[0],o,{visual:`<div class="emo">${w[1]}</div>`,voice:[['en','Look and choose the correct word.']],explain:`${w[1]} = ${w[0]} (${w[2]})`});},
  odd(us){const all=new Set(us.flatMap(enWords).map(w=>w[0]));let sets=ODD_SETS.filter(s=>s.filter(x=>all.has(x)).length>=3);if(!sets.length)sets=ODD_SETS;const A=pick(sets);const inA=shuffle(A.filter(x=>all.has(x)).length>=3?A.filter(x=>all.has(x)):A).slice(0,3);
    const B=pick(ODD_SETS.filter(s=>s!==A&&!s.some(x=>A.includes(x))));const odd=pick(B);return mc('en_vocab','Choose the odd one out.',odd,inA,{voice:[['en','Choose the odd one out.']],explain:`${inA.join(', ')} cùng một nhóm; “${odd}” khác nhóm.`});},
  spell(us){const W=us.flatMap(enWords).filter(w=>/^[a-z]{4,9}$/.test(w[0]));const w=pick(W);const s=w[0];const i=rnd(1,s.length-3);const miss=s.slice(i,i+2);const L='abcdefghiklmnoprstuwy';const wr=new Set();while(wr.size<2){const x=L[rnd(0,L.length-1)]+L[rnd(0,L.length-1)];if(x!==miss)wr.add(x);}
    return mc('en_vocab','Complete the word.',miss,[...wr],{big:s.slice(0,i)+'_ _'+s.slice(i+2),visual:w[1]!=='🔤'?`<div class="emo sm">${w[1]}</div>`:'',voice:[['en',s]],explain:`${s} = ${w[2]}`});},

};
function buildExamEn(k){const T=EN_TESTS[k];const us=T.u;const R=T.read;const passage={title:R.title,text:R.text,en:true};
  const gaps=shuffle(T.gap).slice(0,3).map(([s,a,w])=>mc('en_sent','Choose the correct word.',a,w,{big:s,bigSmall:true,voice:[['en','Choose the correct word.']],explain:s.replace('___',a)}));
  const qas=shuffle(T.qa).slice(0,2).map(([q,a,w])=>mc('en_sent','Choose the correct answer.',a,w,{big:q,bigSmall:true,voice:[['en',q]]}));
  const reads=R.qs.map(([s,t])=>mc('en_read','Read and choose True or False.',t?'True':'False',[],{fixed:['True','False'],big:s,bigSmall:true,passage,voice:[['en',s]]}));
  const safe=f=>()=>{try{const q=f();if(q&&q.type)return q;}catch(e){}return EXE.listen(us);};

/* ============ TRÒ CHƠI: KHỈ CON NHẢY ĐẢO (đếm số bước nhảy giống hình) ============ */
const JUMP_SLOTS=9;
function jumpArcSVG(d,n){const W=200,H=62,gap=W/(n+1);const xs=Array.from({length:n},(_,i)=>gap*(i+1));const x0=xs[0],x1=xs[d];const mid=(x0+x1)/2,top=8;
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="M${x0} 44 Q ${mid} ${top-(d*4)} ${x1} 44" fill="none" stroke="#F07A5A" stroke-width="5" stroke-linecap="round"/>${xs.map((x,i)=>`<circle cx="${x}" cy="48" r="10" fill="${i===0||i===d?'#F07A5A':'#F7C5B7'}"/>`).join('')}</svg>`;}
function gJump(area,upd,end,en,opts){opts=opts||{};const goal=opts.goal||4;let hearts=3,done=0,pos=1,lock=false,target=0,d=1;const maxD=opts.maxD||3;
  area.innerHTML=`<div class="jump"><div class="jump-hud"><span class="hearts" id="jH">${'❤️'.repeat(hearts)}</span><div class="jump-prog" id="jP">${Array.from({length:goal},(_,k)=>`<i data-k="${k}">${k+1}</i>`).join('')}<b>🍑</b></div></div>
   <div class="jump-sky" id="jS"><div class="jump-row" id="jR"></div><div class="monkey" id="jM">🐒</div></div>
   <p class="mg-hint" id="jT">${en?'Count the steps and choose the right jump!':'Đếm số bước đến đảo tiếp theo rồi chọn hình nhảy đúng!'}</p><div class="jump-opts" id="jO"></div></div>`;
  const R=$('#jR'),M=$('#jM'),O=$('#jO');const xOf=i=>(6+i*(88/(JUMP_SLOTS-1)));
  const layout=()=>{d=rnd(1,maxD);pos=rnd(0,Math.max(0,JUMP_SLOTS-1-d-rnd(0,2)));target=pos+d;
    R.innerHTML=Array.from({length:JUMP_SLOTS},(_,i)=>i===pos||i===target?`<div class="isle" style="left:${xOf(i)}%"><span>🏝️</span></div>`:`<div class="step" style="left:${xOf(i)}%"></div>`).join('');
    M.style.transition='none';M.style.left=xOf(pos)+'%';M.classList.remove('hop');void M.offsetWidth;M.style.transition='';
    const choices=shuffle([d,...shuffle([1,2,3,4].filter(x=>x!==d&&x<=Math.max(maxD,3))).slice(0,2)]);
    O.innerHTML=choices.map(c=>`<button class="jopt" data-d="${c}" aria-label="Nhảy ${c} bước">${jumpArcSVG(c,5)}</button>`).join('');
    O.querySelectorAll('.jopt').forEach(b=>b.onclick=()=>pickD(+b.dataset.d,b));lock=false;};
  const pickD=(c,b)=>{if(lock)return;lock=true;
    if(c===d){sfx.coin();b.classList.add('ok');M.classList.add('hop');M.style.left=xOf(target)+'%';done++;const p=$('#jP');if(p){const it=p.querySelector(`[data-k="${done-1}"]`);if(it)it.classList.add('on');}upd(done,goal);
      setTimeout(()=>{if(done>=goal){end(true);return;}layout();},750);}
    else{sfx.bad();hearts--;b.classList.add('bad');const h=$('#jH');if(h)h.textContent='❤️'.repeat(hearts)+'🤍'.repeat(3-hearts);M.classList.remove('shake');void M.offsetWidth;M.classList.add('shake');
      if(hearts<=0){setTimeout(()=>end(false),500);return;}setTimeout(()=>{b.classList.remove('bad');lock=false;},500);}};
  layout();}

const CAM_SEC={L:'🎧 Listening',R:'📖 Reading & Writing',S:'🗣️ Speaking'};
function buildCam(k){const T=CAM_TESTS[k];const out=[];const tag=(q,sec)=>Object.assign(q,{sec,secLab:CAM_SEC[sec]});
  T.L.forEach(x=>{if(x[0]==='pic')out.push(tag(mc('en_listen','Listen and choose the right picture.',x[2],x[3],{emo:true,voice:[['en',x[1]]],auto:true,explain:x[1]}),'L'));
    else out.push(tag(mc('en_listen',x[2],x[3],x[4],{voice:[['en',x[1]],['en',x[2]]],auto:true,explain:x[1]}),'L'));});
  T.R.forEach(x=>{const k0=x[0];
    if(k0==='tf')out.push(tag(mc('en_read','Look and read. Write yes or no.',x[3]?'yes':'no',[],{fixed:['yes','no'],visual:`<div class="emo">${x[1]}</div>`,big:x[2],bigSmall:true,voice:[['en',x[2]]],explain:x[3]?'Câu đúng với tranh.':'Câu không đúng với tranh.'}),'R'));
    else if(k0==='spell')out.push(tag(ord('en_vocab','Look at the picture. Put the letters in order.',x[2].split(''),{visual:`<div class="emo sm">${x[1]}</div>`,voice:[['en','Look at the picture. Put the letters in order.']],explain:x[2]}),'R'));
    else if(k0==='def')out.push(tag(mc('en_vocab','Read the sentence. Choose the right word.',x[2],x[3],{big:x[1],bigSmall:true,voice:[['en',x[1]]],explain:x[1]+' → '+x[2]}),'R'));
    else if(k0==='gap')out.push(tag(mc('en_sent','Choose the right word.',x[2],x[3],{big:x[1],bigSmall:true,voice:[['en','Choose the right word.']],explain:x[1].replace('___',x[2])}),'R'));
    else if(k0==='qa')out.push(tag(mc('en_sent','Read the question. Choose the best answer.',x[2],x[3],{big:x[1],bigSmall:true,voice:[['en',x[1]]]}),'R'));
    else if(k0==='story'){const passage={title:x[1].title,text:x[1].text,en:true};x[2].forEach(([q,a,w])=>out.push(tag(mc('en_read','Read the story. Choose the right answer.',a,w,{big:q,bigSmall:true,passage,voice:[['en',q]]}),'R')));}
    else if(k0==='ord')out.push(tag(ord('en_sent','Put the words in the correct order.',x[1].split(' '),{voice:[['en','Put the words in the correct order.']],explain:x[1]}),'R'));});
  T.S.forEach(x=>out.push(tag({type:'speak',skill:'en_listen',prompt:x[1],answer:x[2],hint:x[3],visual:`<div class="emo">${x[0]}</div>`,voice:[['en',x[1]]],auto:true,explain:'Câu mẫu: '+x[2]},'S')));
  return out;}
function camShields(sec){const c=sec?sec.c:0,t=sec?sec.t:0;return t?Math.max(1,Math.round(c/t*5)):0;}
function shieldsHTML(n){return `<span class="shields" aria-label="${n} khiên">${'🛡️'.repeat(n)}<i>${'🛡️'.repeat(5-n)}</i></span>`;}
/* Ô trả lời của câu Speaking: nghe giám khảo hỏi → con ghi âm câu trả lời → chấm sao (≥3★ là đạt). */
function renderSpeakAns(q){const ans=$('#ans');let shown=false;Q.spkRes=null;
  const draw=resH=>{ans.innerHTML=`<div class="voc-card spk-prac"><div class="voc-ex"><p>${shown?esc(q.answer):`<i>${esc(q.hint||'Con hãy trả lời bằng một câu đầy đủ.')}</i>`}</p>${shown?`<button class="spk" id="cSay" aria-label="Nghe câu mẫu">🔊</button>`:`<button class="say-btn" id="cShow">💡 Xem câu mẫu</button>`}</div>
    <div class="rec-row"><button class="rec-btn" id="cRec">🎤 Trả lời</button><button class="link-btn" id="cSkip">Không ghi âm được? Bỏ qua</button></div><div id="cRes">${resH||''}</div></div>`;
    if($('#cShow'))$('#cShow').onclick=()=>{shown=true;Q.spkPeek=true;draw(resH);speak([['en',q.answer]]);};if($('#cSay'))$('#cSay').onclick=()=>speak([['en',q.answer]]);
    $('#cSkip').onclick=()=>{if(Q.locked)return;stopRec();Q.spkRes={noScore:true,skip:true};$('#check').disabled=false;check();};
    $('#cRec').onclick=()=>{if(Q.locked)return;const myQ=Q,myI=Q.i;recordAndScore(q.answer,res=>{if(Q!==myQ||Q.i!==myI||Q.locked)return;Q.spkRes=res;draw(recResultHTML(res,q.answer));$('#check').disabled=false;},$('#cRec'));};};
  draw();}

function examBanner(subj){const E=EXAM_SUBJ[subj];const L=E.list();const st=exS().stars;const done=L.filter((_,k)=>(st[subj+'_'+k]||0)>=1).length;

function renderExams(subj){Q=null;stopSpeed();stopVoice();const E=EXAM_SUBJ[subj];const L=E.list();const st=exS().stars,best=exS().best||{};
  const back=subj==='toan'?'map':subj==='cam'?'en':subj;const EN=subj==='en'||subj==='cam';
  app.innerHTML=`<div class="screen notebook" id="scr">${topbar()}<div class="page" style="position:relative;z-index:1;padding-left:44px"><h1>${subj==='cam'?'🏅 Cambridge Young Learners':`📝 ${subj==='en'?'Practice tests':'Luyện đề'} ${E.n}`}</h1><p class="lead">${subj==='toan'?EXAM_LEAD_TOAN:subj==='tv'?EXAM_LEAD_TV:subj==='cam'?EXAM_LEAD_CAM:'Mỗi đề có đủ các dạng: Listen, Look and choose, Odd one out, Complete, Order, Read.'}</p>
  <div class="exam-list">${L.map((x,k)=>{const s=st[subj+'_'+k]||0,b=best[subj+'_'+k];return `<button class="exam-card" data-k="${k}" style="--c:${E.c};--cd:${E.cd}"><span class="ex-num">${k+1}</span><span class="ex-txt"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span><span class="ex-st">${s?`<span class="exst">${'★'.repeat(s)}<i>${'★'.repeat(3-s)}</i></span>`:''}${b!=null?`<small>${String(b).replace('.',',')}/10</small>`:'<small>Chưa làm</small>'}</span></button>`;}).join('')}</div>
  </div></div>${tabbar(back)}`;

/* ---------- English ---------- */
function enWrong(s){const t=s.split(' ');const R=[[/^is$/,'are'],[/^are$/,'is'],[/^has$/,'have'],[/^have$/,'has'],[/^can$/,'cans'],[/^like$/,'likes'],[/^This$/,'These'],[/^These$/,'This'],[/^Those$/,'That'],[/^a$/,'an'],[/^an$/,'a'],[/^my$/,'I'],[/^his$/,'he'],[/^her$/,'she'],[/^don't$/,"doesn't"],[/^I'm$/,"I's"],[/^He's$/,"He're"],[/^She's$/,"She're"],[/^There's$/,"There're"],[/^in$/,'at'],[/^on$/,'in']];
  const out=new Set();t.forEach((w,i)=>{for(const[re,rp]of R)if(re.test(w)){const c=t.slice();c[i]=w.replace(re,rp);out.add(c.join(' '));}});
  if(t.length>=3){const c=t.slice();const i=rnd(0,t.length-2);[c[i],c[i+1]]=[c[i+1],c[i]];out.add(c.join(' '));}out.delete(s);return[...out];}
function chEn(u,d){const U=EN_UNITS[u];const W=U.w,C=U.c;const out=[];
  if(d===0){const pic=W.filter(w=>w[1]!=='🔤');
    const long=W.filter(w=>/^[a-z]{5,}$/.test(w[0]));if(long.length){const w=pick(long),s=w[0];const i=rnd(1,s.length-4);const miss=s.slice(i,i+3);const wr=new Set();let g=0;const AB='aeioulnrst';while(wr.size<2&&g++<60){const x=g<20?shuffle(miss.split('')).join(''):AB[rnd(0,9)]+AB[rnd(0,9)]+AB[rnd(0,9)];if(x!==miss)wr.add(x);}
      out.push(mc('en_vocab','Complete the word (3 letters).',miss,[...wr],{big:s.slice(0,i)+'_ _ _'+s.slice(i+3),visual:`<div class="emo sm">${w[1]}</div>`,voice:[['en','Complete the word.']],explain:`${s} = ${w[2]}`}));}
    const odd=EXE.odd([u]);out.push(odd);
    const w2=pick(W);const others=shuffle(EN_UNITS.filter((_,j)=>j!==u).flatMap(x=>x.w)).slice(0,2).map(x=>x[2]);out.push(mc('en_vocab','What does this word mean?',w2[2],others,{big:w2[0],voice:[['en',w2[0]]],explain:`${w2[0]} = ${w2[2]}`}));}
  else if(d===1){const c3=C.filter(x=>x[0].split(' ').length>=3);const c=pick(c3.length?c3:C);const words=c[0].replace(/[.?!,]/g,'').split(' ');const k=rnd(1,words.length-1);const miss=words[k];const pool=shuffle([...new Set(C.flatMap(x=>x[0].replace(/[.?!,]/g,'').split(' ')).concat(W.map(w=>w[0])))].filter(x=>x!==miss&&x.toLowerCase()!==miss.toLowerCase())).slice(0,2);
    out.push(mc('en_listen','Listen and choose the missing word.',miss,pool,{big:c[0].replace(new RegExp('\\b'+miss.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b'),'___'),bigSmall:true,voice:[['en',c[0]]],auto:true,explain:`${c[0]} = ${c[1]}`}));
    const c2=pick(C);out.push(mc('en_listen','Listen and choose the correct meaning.',c2[1],shuffle(C.filter(x=>x!==c2)).slice(0,2).map(x=>x[1]),{voice:[['en',c2[0]]],auto:true,explain:`${c2[0]} = ${c2[1]}`}));
    out.push(EXE.listenSent([u,Math.max(0,u-1)]));}
  else{const cs=shuffle(C);let added=0;for(const c of cs){const wr=shuffle(enWrong(c[0])).slice(0,2);if(wr.length<2)continue;out.push(mc('en_sent','Which sentence is correct?',c[0],wr,{voice:[['en','Which sentence is correct?']],explain:`${c[0]} = ${c[1]}`}));if(++added>=2)break;}
    const lg=C.filter(x=>x[0].split(' ').length>=4);if(lg.length)out.push(ord('en_sent','Put the words in the correct order.',pick(lg)[0].split(' '),{voice:[['en','Put the words in the correct order.']]}));}
  return out.slice(0,3).map(q=>{q.hard=true;return q;});}

      const x=pick(w);
      if(GRADE<=2)ex.push(mkText('en_vocab','Type the English word. (Gõ từ tiếng Anh)',x[0],{visual:`<div class="emo">${x[1]}</div>`,voice:[['vi','Gõ từ tiếng Anh']],explain:x[1]+' = '+x[0]+' ('+x[2]+')'}));
      else ex.push(mkText('en_vocab','Type this in English. (Gõ bằng tiếng Anh)',x[0],{big:x[2],visual:`<div class="emo sm">${x[1]}</div>`,voice:[['vi','Gõ bằng tiếng Anh'],['vi',x[2]]],explain:x[1]+' = '+x[0]+' ('+x[2]+')'}));
    }
  }
  if(d===1&&w.length>=3){
    ex.push(mkMatch('en_listen',wm(5).map(x=>[x[0],x[1]]),{mode:'pic',hint:'listen',prompt:'Tap 🔊, then tap the matching picture. (Nghe rồi chọn hình tương ứng)',voice:[['vi','Nghe rồi chọn hình tương ứng']]}));
    if(GRADE>=1){
      const x=pick(w);
      ex.push(mkText('en_listen','Listen and type. (Nghe và gõ lại)',x[0],{auto:true,voice:[['en',x[0]]],explain:x[1]+' '+x[0]+' = '+x[2]}));
    }
  }
  if(d===2&&c.length>=3){
    if(GRADE===0){
      const cc=cm(4).filter(x=>x[2]);
      if(cc.length>=3)ex.push(mkMatch('en_sent',cc.map(x=>[x[0],x[2]]),{mode:'pic',hint:'say'}));
    }else{
      ex.push(mkMatch('en_sent',cm(4).map(x=>[x[0],x[1]]),{mode:'sent'}));
      const mx=GRADE<=2?6:9;
      const cs=c.filter(x=>okTok(mx)(x[0]));
      if(cs.length){const x=pick(cs);ex.push(mkBank('en_sent',x[0],x[1],'vi2en',c));}
      if(GRADE>=3){const cv=c.filter(x=>okTok(9)(x[1])&&okTok(9)(x[0]));if(cv.length){const x=pick(cv);ex.push(mkBank('en_sent',x[0],x[1],'en2vi',c));}}
    }
  }
  return ex.filter(Boolean).slice(0,3);
}
function mixExtras(qs,u,d){
  if(!qs||qs.length<5)return qs;
  const ex=extrasFor(u,d);if(!ex.length)return qs;
  const idx=shuffle(qs.map((q,i)=>i).filter(i=>i>0&&qs[i].type==='mc'&&!qs[i].hard&&!qs[i].passage));
  const out=qs.slice();
  ex.forEach((q,k)=>{if(idx[k]!==undefined)out[idx[k]]=q;});
  return out;
}
const _buildEn=buildEn;
buildEn=function(u,d){const qs=_buildEn.apply(this,arguments);try{return mixExtras(qs,u,d);}catch(e){return qs;}};

/* ---------------- hiển thị các dạng bài mới ---------------- */
const CUSTOM={match:1,text:1,bank:1};
function renderMatch(q){
  const ans=$('#ans'),n=q.pairs.length;
  const Ls=shuffle(q.pairs.map((p,i)=>({i,t:p[0]}))),Rs=shuffle(q.pairs.map((p,i)=>({i,t:p[1]})));
  Q.mm={sel:null,done:0,mist:0,n};
  const hideL=q.hint==='listen',pic=q.mode==='pic';
  const sz=t=>String(t).length>24?' small':'';
  const tl=x=>`<button type="button" class="mt${sz(x.t)}" data-s="L" data-i="${x.i}"${hideL?' aria-label="Nghe"':''}>${hideL?'🔊':(q.hint==='say'?'🔊 ':'')+esc(x.t)}</button>`;
  const tr=x=>`<button type="button" class="mt${pic?' big-e':sz(x.t)}" data-s="R" data-i="${x.i}">${esc(x.t)}</button>`;
  ans.innerHTML=`<div class="duo-match"><div class="col">${Ls.map(tl).join('')}</div><div class="col">${Rs.map(tr).join('')}</div></div>`;
  const check0=$('#check');if(check0)check0.disabled=true;
  ans.querySelectorAll('.mt').forEach(b=>b.onclick=()=>{
    if(Q.locked||Q.qs[Q.i]!==q||b.classList.contains('done')||b.classList.contains('ok'))return;
    const m=Q.mm,side=b.dataset.s;sfx.tap();
    if(side==='L')sayEn(q.pairs[+b.dataset.i][0]);
    const cur=m.sel;
    if(!cur||cur.dataset.s===side){if(cur)cur.classList.remove('on');if(cur===b){m.sel=null;return;}b.classList.add('on');m.sel=b;return;}
    m.sel=null;cur.classList.remove('on');
    if(cur.dataset.i===b.dataset.i){
      cur.classList.add('ok');b.classList.add('ok');m.done++;setTimeout(sfx.coin,120);
      setTimeout(()=>{cur.classList.replace('ok','done');b.classList.replace('ok','done');},450);
      if(m.done>=m.n){const c=$('#check');if(c)c.disabled=false;setTimeout(()=>{if(Q&&Q.qs[Q.i]===q&&!Q.locked)check();},700);}
    }else{
      m.mist++;sfx.bad();cur.classList.add('bad');b.classList.add('bad');
      setTimeout(()=>{cur.classList.remove('bad');b.classList.remove('bad');},450);
    }
  });
}
function renderText(q){
  const ans=$('#ans'),pw=$('#padwrap');
  const en=EN(),ph=en?'Type in English':'Gõ bằng tiếng Anh';
  Q.typed='';
  ans.innerHTML=`<div class="duo-type" id="tbox" aria-live="polite"><span class="ph">${ph}</span><i class="caret"></i></div>`;
  const btn=k=>`<button type="button" data-k="${k}"${k==="'"?' aria-label="Dấu nháy"':''}>${k}</button>`;
  const hasDigit=/\d/.test(q.answer);
  pw.innerHTML=`<div class="duo-kb">${hasDigit?`<div class="kr">${'1234567890'.split('').map(btn).join('')}</div>`:''}
    <div class="kr">${'qwertyuiop'.split('').map(btn).join('')}</div>
    <div class="kr">${'asdfghjkl'.split('').map(btn).join('')}</div>
    <div class="kr">${'zxcvbnm'.split('').map(btn).join('')}<button type="button" class="wide" data-k="B" aria-label="Xóa một chữ">⌫</button></div>
    <div class="kr"><button type="button" data-k="'" aria-label="Dấu nháy">'</button><button type="button" class="sp" data-k=" ">${en?'space':'dấu cách'}</button><button type="button" data-k="-" aria-label="Gạch nối">-</button></div></div>`;
  const draw=()=>{const box=$('#tbox');if(!box)return;box.innerHTML=(Q.typed?esc(Q.typed).replace(/ /g,'&nbsp;'):`<span class="ph">${ph}</span>`)+'<i class="caret"></i>';
    const c=$('#check');if(c)c.disabled=!norm(Q.typed);};
  const key=k=>{
    if(Q.locked||Q.qs[Q.i]!==q)return;
    if(k==='B')Q.typed=Q.typed.slice(0,-1);
    else if(Q.typed.length<40)Q.typed+=(Q.typed===''&&k===' ')?'':k;
    draw();
  };
  Q.tkey=key;
  pw.querySelectorAll('button').forEach(b=>b.onclick=()=>{sfx.tap();key(b.dataset.k);});
}
/* bàn phím máy tính: gõ chữ/số, Backspace; Enter do bộ xử lý phím gốc của app lo */
document.addEventListener('keydown',e=>{
  if(!Q||!Q.tkey||Q.locked||!Q.qs||!Q.qs[Q.i]||Q.qs[Q.i].type!=='text'||document.querySelector('.modal'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Backspace'){e.preventDefault();Q.tkey('B');}
  else if(e.key.length===1&&/[\p{L}\p{N}' \-]/u.test(e.key)){e.preventDefault();Q.tkey(e.key.toLowerCase());}
});
function renderBank(q){
  const ans=$('#ans');Q.placed=[];
  ans.innerHTML=`<div class="duo-line" id="dline"></div><div class="duo-pool" id="dpool"></div>`;
  drawBank(q);
}
function drawBank(q){
  const line=$('#dline'),pool=$('#dpool');
  line.innerHTML=Q.placed.map(k=>`<button type="button" class="chip" data-k="${k}">${esc(q.items[k])}</button>`).join('');
  pool.innerHTML=q.items.map((t,k)=>`<button type="button" class="chip${Q.placed.includes(k)?' ghost':''}" data-k="${k}"${Q.placed.includes(k)?' tabindex="-1" aria-hidden="true"':''}>${esc(t)}</button>`).join('');
  line.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(Q.locked)return;sfx.tap();Q.placed=Q.placed.filter(x=>x!==+b.dataset.k);drawBank(q);});
  pool.querySelectorAll('.chip:not(.ghost)').forEach(b=>b.onclick=()=>{if(Q.locked)return;sfx.tap();if(q.dir==='vi2en')sayEn(q.items[+b.dataset.k]);Q.placed.push(+b.dataset.k);drawBank(q);});
  const c=$('#check');if(c)c.disabled=!Q.placed.length;
}
const _renderAnswer=renderAnswer;
renderAnswer=function(q){
  if(q&&q.type==='match')return renderMatch(q);
  if(q&&q.type==='text')return renderText(q);
  if(q&&q.type==='bank')return renderBank(q);
  return _renderAnswer.apply(this,arguments);
};
function customOk(q){
  if(q.type==='match')return !!Q.mm&&Q.mm.done>=q.pairs.length&&Q.mm.mist<=1;
  if(q.type==='text'){const v=norm(Q.typed);return !!v&&[q.answer].concat(q.alts||[]).some(a=>norm(a)===v);}
  if(q.type==='bank')return Q.placed.map(k=>norm(q.items[k])).join(' ')===q.tokens.map(norm).join(' ');
  return false;
}

/* ---------------- combo + làm lại câu sai ---------------- */
const reviewable=()=>!!Q&&Q.qs&&(!Q.mode||Q.mode==='en'||Q.mode==='tv');
function setCombo(pop){
  const el=document.querySelector('.duo-combo');if(!el||!Q)return;
  const n=Q.combo||0;el.textContent=n>=2?'COMBO x'+n:'';el.classList.toggle('gold',n>=5);
  el.classList.remove('pop');if(pop&&n>=2){void el.offsetWidth;el.classList.add('pop');}
  const bar=document.querySelector('.quiz .bar');if(bar)bar.classList.toggle('gold',n>=5);
}
function decorate(){
  const quiz=document.querySelector('.quiz');if(!quiz||!Q||!Q.qs)return;
  const q=Q.qs[Q.i];
  if(!quiz.querySelector('.duo-combo')){const d=document.createElement('div');d.className='duo-combo';quiz.insertBefore(d,quiz.firstChild);}
  setCombo(false);
  const head=quiz.querySelector('.qhead');
  if(Q.review&&head){const t=document.createElement('div');t.className='duo-rvtag';t.textContent=EN()?'Practice mistakes':'Ôn lại câu sai';head.parentNode.insertBefore(t,head);}
  const bs=$('#bubSay');if(bs&&q)bs.onclick=()=>q.bubbleLang==='en'?sayEn(q.bubble):sayVi(q.bubble);
  }
const _renderQ=renderQ;
renderQ=function(){_renderQ.apply(this,arguments);try{decorate();}catch(e){}};

const fresh=q=>{const c=JSON.parse(JSON.stringify(q));delete c._sh;if(c.type==='order'&&c.items)c.items=shuffle(c.items);if(c.type==='bank')c.items=shuffle(c.items);return c;};
const _check=check;
check=function(){
  const q=Q&&Q.qs&&Q.qs[Q.i];
  if(!q||Q.locked||!reviewable()&&!CUSTOM[q.type])return _check.apply(this,arguments);
  const rv=!!Q.review,sk=q.skill;
  const snap=rv?{c:Q.correct,coins:Q.coins,secs:Q.secs?JSON.stringify(Q.secs):null,sd:Q.skillDelta?JSON.stringify(Q.skillDelta):null,
    st:S.stats&&S.stats[sk]?{c:S.stats[sk].c,t:S.stats[sk].t}:null}:null;
  if(CUSTOM[q.type]){
    const ok=customOk(q),t=q.type;q.type='mc';Q.sel=ok?q.answer:'\u0000';
    try{_check.apply(this,arguments);}finally{q.type=t;}
    const tb=$('#tbox');if(tb)tb.classList.add('off');
  }else _check.apply(this,arguments);
  const sh=$('#sheet'),bad=!!sh&&sh.classList.contains('bad');
  if(rv){   /* vòng ôn lại không tính điểm, xu, thống kê */
    Q.correct=snap.c;Q.coins=snap.coins;Q.secs=snap.secs?JSON.parse(snap.secs):undefined;Q.skillDelta=snap.sd?JSON.parse(snap.sd):undefined;
    if(Q.secs===undefined)delete Q.secs;if(Q.skillDelta===undefined)delete Q.skillDelta;
    if(snap.st){S.stats[sk].c=snap.st.c;S.stats[sk].t=snap.st.t;}else if(S.stats)delete S.stats[sk];
    try{save();}catch(e){}
    const fc=sh&&sh.querySelector('.fb-coin');if(fc)fc.remove();
  }
  if(bad&&q.type!=='speak')(Q.rvWrong||(Q.rvWrong=[])).push(q);
  Q.combo=bad?0:(Q.combo||0)+1;
  setCombo(true);
  if(!bad&&Q.combo>=3&&sh){const d=document.createElement('div');d.className='fb-combo';d.textContent='🔥 COMBO x'+Q.combo;const b=sh.querySelector('.btn');if(b)b.parentNode.insertBefore(d,b);}
};

function reviewIntro(n,go){
  const en=EN();
  const t1=en?"Let's fix the mistakes!":'Ôn lại các câu làm sai';
  const t2=en?`You have ${n} question${n>1?'s':''} to try again. Get them all right to finish! (Con còn ${n} câu cần làm lại.)`:`Con còn ${n} câu cần làm lại. Làm đúng hết mới hoàn thành bài nhé!`;
  app.innerHTML=`<div class="quiz"><div class="duo-combo"></div><div class="qtop"><button class="icon-btn" id="quit" aria-label="Thoát bài">✕</button><div class="bar"><i style="width:100%"></i></div></div><div class="duo-rv"><div class="duo-rv-ic" aria-hidden="true">🦉</div><h1>${esc(t1)}</h1><p>${esc(t2)}</p><button class="btn btn-go" id="rvGo">${en?'Start':'Bắt đầu'}</button></div></div>`;
  $('#quit').onclick=confirmQuit;$('#rvGo').onclick=go;setCombo(false);
  if(typeof say==='function'&&S.autoRead!==false)setTimeout(()=>{if(document.getElementById('rvGo'))say(`Ôn lại ${n} câu làm sai nhé!`,true);},350);
}
const _finish=finish;
finish=function(){
  if(!reviewable()||Q.mode&&Q.mode==='exam')return _finish.apply(this,arguments);
  const pend=Q.rvWrong||[];
  if(pend.length){
    try{
      Q.orig=Q.orig||Q.qs;Q.review=true;Q.round=(Q.round||0)+1;Q.rvTotal=Math.max(Q.rvTotal||0,pend.length);Q.gamePlayed=true;
      Q.rvWrong=[];Q.qs=pend.map(fresh);Q.i=0;Q.locked=false;
      reviewIntro(Q.qs.length,()=>renderQ());
      return;
    }catch(e){if(Q.orig){Q.qs=Q.orig;Q.orig=null;}Q.review=false;}
  }
  const hadReview=!!Q.review,rvN=Q.rvTotal||0;
  if(Q.orig){Q.qs=Q.orig;Q.orig=null;}Q.review=false;Q.i=Q.qs.length;
  const r=_finish.apply(this,arguments);
  if(hadReview){const res=document.querySelector('.result');if(res){const p=document.createElement('p');p.className='duo-rvnote';p.textContent=(EN()?'💪 You fixed all your mistakes! (Con đã làm lại ':'💪 Con đã làm lại ')+rvN+' câu sai đến khi đúng hết'+(EN()?')':'!');const rw=res.querySelector('.rewards');if(rw)res.insertBefore(p,rw);else res.appendChild(p);}}
  return r;
};
})();
</script>
