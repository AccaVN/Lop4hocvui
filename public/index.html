<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="256x256" href="/favicon.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<title>Học Vui Lớp 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap"></noscript>
<style>
:root{
  --sky:#1D8CE0;--sky-d:#1466AB;--leaf:#16A34A;--leaf-d:#107A37;--berry:#F0476A;--berry-d:#C22D4E;--sun:#FFC83D;
  --ink:#1B2559;--muted:#56648F;--paper:#EEF6FF;--grid:#D7E5F7;--margin:#F7A8B8;--card:#FFFFFF;--line:#D3E1F3;--soft:#E1EDFB;--lock:#CDD6E5;--lock-d:#AAB6CB;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#F1F5FF;--muted:#A8B5DB;--paper:#101A35;--grid:#19284D;--margin:#5A2C45;--card:#1B2A52;--line:#2C3F70;--soft:#243762;--lock:#34446E;--lock-d:#243258;color-scheme:dark}
}
:root[data-theme="dark"]{--ink:#F1F5FF;--muted:#A8B5DB;--paper:#101A35;--grid:#19284D;--margin:#5A2C45;--card:#1B2A52;--line:#2C3F70;--soft:#243762;--lock:#34446E;--lock-d:#243258;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Baloo 2","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{height:100%;max-width:540px;margin:0 auto;position:relative}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
img,svg{max-width:100%}
.screen{height:100%;overflow-y:auto;overflow-x:hidden;padding-bottom:96px;-webkit-overflow-scrolling:touch}
/* Nền vở ô li */
.notebook{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);background-size:24px 24px;position:relative}
.notebook.nogrid{background-image:none}.notebook.nogrid::before{display:none}
.notebook::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:var(--margin);pointer-events:none}

/* Thanh trên */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--paper);border-bottom:2px solid var(--line)}
.me{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;min-width:0}
.me .ava{font-size:30px;line-height:1}
.me span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:17px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:1px 10px}

/* Lời chào */
.hello{display:flex;gap:10px;align-items:flex-start;margin:14px 14px 4px 44px;position:relative;z-index:1}
.owl{font-size:52px;line-height:1;flex:none;transform:translateY(4px)}
.say{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-size:17px;position:relative;flex:1}
.say::before{content:"";position:absolute;left:-9px;top:20px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.goal{margin-top:8px}
.goal-bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.goal-bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.goal small{color:var(--muted);font-weight:600}

/* Bản đồ */
.stage{position:relative;z-index:1}
.stage-head{margin:22px 14px 0 44px;border-radius:22px;padding:12px 18px 14px;background:var(--c);color:#fff;box-shadow:0 6px 0 var(--cd)}
.stage-num{font-weight:700;font-size:15px;opacity:.92}
.stage-head h2{margin:0;font-size:27px;line-height:1.15;font-weight:800}
.stage-head p{margin:4px 0 0;font-size:15px;line-height:1.3;opacity:.95}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0 10px 30px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(var(--x))}
.node{width:78px;height:72px;border-radius:50%;border:0;font-size:32px;background:var(--c);box-shadow:0 7px 0 var(--cd);transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 var(--cd)}
.node.boss{width:94px;height:86px;font-size:40px}
.node.locked{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);font-size:26px}
.node-lbl{font-size:14px;font-weight:700;color:var(--muted);margin-top:10px;background:var(--paper);padding:0 8px;border-radius:8px;text-align:center}
.node-stars{color:var(--sun);font-size:18px;line-height:1;letter-spacing:1px;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.node-stars .dim{color:var(--lock)}
.current .node{animation:bob 1.5s ease-in-out infinite}
.start-tip{position:absolute;top:-40px;background:var(--card);border:2.5px solid var(--c);color:var(--c);font-weight:800;font-size:16px;border-radius:12px;padding:0 12px;white-space:nowrap;z-index:2;animation:bob 1.5s ease-in-out infinite}
.start-tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--card);border-right:2.5px solid var(--c);border-bottom:2.5px solid var(--c);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
.map-end{text-align:center;font-weight:700;color:var(--muted);margin:30px 20px 10px 44px;position:relative;z-index:1}

/* Thanh tab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:none;padding:8px 0 6px;font-weight:700;font-size:12px;line-height:1.15;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0}
.tab span{font-size:26px;line-height:1.1;filter:grayscale(.7);opacity:.75}
.tab.on{color:var(--sky)}
.tab.on span{filter:none;opacity:1}

/* Nút */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:12px 18px;font-weight:800;font-size:21px;color:#fff;background:var(--c,var(--sky));box-shadow:0 5px 0 var(--cd,var(--sky-d));transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd,var(--sky-d))}
.btn:disabled{background:var(--lock);box-shadow:0 5px 0 var(--lock-d);color:var(--muted);cursor:not-allowed;transform:none}
.btn-go{--c:var(--leaf);--cd:var(--leaf-d)}
.btn-bad{--c:var(--berry);--cd:var(--berry-d)}
.btn-soft{--c:var(--card);--cd:var(--line);color:var(--ink);border:2px solid var(--line)}
.btn+.btn{margin-top:14px}
.icon-btn{border:0;background:none;font-size:26px;padding:4px 8px;line-height:1;color:var(--muted)}

/* Bài làm */
.quiz{height:100%;display:flex;flex-direction:column;background:var(--paper);position:relative;overflow:hidden}
.qtop{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.bar{flex:1;height:18px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .3s}
.bar.timer i{background:var(--sun);transition:width .1s linear}
.qcount{font-weight:800;color:var(--muted);min-width:44px;text-align:right}
.qbody{flex:1;overflow-y:auto;padding:4px 16px 12px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tag{font-weight:800;font-size:15px;border-radius:999px;padding:1px 12px;color:#fff}
.tag-toan{background:var(--sky)}.tag-tv{background:var(--berry)}.tag-kp{background:var(--leaf)}
.prompt{font-size:22px;font-weight:700;line-height:1.35;margin:4px 0 10px}
.picon{font-size:30px;margin-right:6px;vertical-align:-4px}
.big{font-size:40px;font-weight:800;text-align:center;margin:8px 0 14px;letter-spacing:.5px;line-height:1.2}
.slot{display:inline-block;min-width:1.4em;padding:0 .2em;border-bottom:4px dashed var(--sky);color:var(--sky)}
.slot.filled{border-bottom-style:solid}
.inputbox{display:flex;align-items:baseline;justify-content:center;gap:10px;font-size:40px;font-weight:800;margin:6px 0 4px}
.inputbox .unit{font-size:20px;color:var(--muted);font-weight:700}
.opts{display:grid;gap:12px}
.opts.short{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--card);color:var(--ink);border:2.5px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 var(--line);text-align:left;font-weight:700;font-size:20px;line-height:1.3;transition:transform .06s}
.opts.short .opt{text-align:center;font-size:30px;padding:8px}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--sky);box-shadow:0 4px 0 var(--sky-d);background:var(--soft)}
.opt.right{border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf-d)}
.opt.wrong{border-color:var(--berry);box-shadow:0 4px 0 var(--berry-d)}
.qfoot{padding:8px 16px 14px;background:var(--paper);border-top:2px solid var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.key{font-size:27px;font-weight:800;padding:4px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.key.fn{font-size:22px;color:var(--muted)}
.line{min-height:60px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px;margin-bottom:14px;align-items:center}
.line-hint{color:var(--muted);font-size:16px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:6px 14px;font-weight:700;font-size:20px;box-shadow:0 4px 0 var(--line);line-height:1.3;text-align:left}
.chip.long{width:100%;font-size:18px}
.chip.ghost{visibility:hidden}
.line .chip{border-color:var(--sky);box-shadow:0 4px 0 var(--sky-d)}
.passage{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 14px 12px;margin:4px 0 12px}
.passage summary{font-weight:800;font-size:19px;cursor:pointer}
.passage p{margin:6px 0 8px;font-size:18px;line-height:1.55}
.say-btn{border:2px solid var(--sky);background:var(--card);color:var(--sky);border-radius:999px;font-weight:800;font-size:18px;padding:4px 14px}
.say-btn.large{display:block;margin:4px auto 16px;font-size:22px;padding:8px 22px;box-shadow:0 4px 0 var(--sky-d)}
.clock{display:block;width:190px;height:190px;margin:0 auto 14px;color:var(--ink)}
.poly{display:block;width:100%;max-width:320px;margin:0 auto 14px;color:var(--ink)}
.groups{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 14px}
.grp{border:2.5px dashed var(--sky);border-radius:14px;padding:4px 8px;font-size:24px;letter-spacing:2px}

/* Bảng phản hồi */
.sheet{position:absolute;left:0;right:0;bottom:0;transform:translateY(105%);transition:transform .25s ease-out;z-index:20;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
.sheet.show{transform:none}
.sheet.good{background:#DDF7E6;color:#0F5C2E}
.sheet.bad{background:#FFE1E7;color:#8A1B34}
:root[data-theme="dark"] .sheet.good{background:#12402A;color:#C9F5DA}
:root[data-theme="dark"] .sheet.bad{background:#4A1B2A;color:#FFD3DC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet.good{background:#12402A;color:#C9F5DA}:root:not([data-theme="light"]) .sheet.bad{background:#4A1B2A;color:#FFD3DC}}
.fb-title{font-size:26px;font-weight:800}
.fb-ans{font-size:19px;margin-top:2px}
.fb-exp{font-size:17px;margin-top:6px;white-space:pre-line;line-height:1.45;background:rgba(255,255,255,.45);border-radius:12px;padding:6px 12px}
:root[data-theme="dark"] .fb-exp{background:rgba(0,0,0,.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fb-exp{background:rgba(0,0,0,.2)}}
.fb-coin{font-weight:800;font-size:19px}
.sheet .btn{margin-top:14px}

/* Kết quả */
.result{height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px}
.result h1{font-size:34px;margin:4px 0 0;line-height:1.15}
.res-owl{font-size:84px;line-height:1}
.res-stars{font-size:62px;line-height:1;margin:10px 0 4px;letter-spacing:4px}
.res-stars span{color:var(--lock);display:inline-block}
.res-stars span.on{color:var(--sun);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;text-shadow:0 3px 0 #D9A21E}
.res-stars span:nth-child(2){animation-delay:.25s}.res-stars span:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.result p{margin:4px 0;font-size:19px;color:var(--muted);font-weight:600}
.rewards{display:flex;gap:12px;justify-content:center;margin:14px 0 22px;flex-wrap:wrap}
.reward{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 18px;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center}
.reward small{font-size:14px;color:var(--muted);font-weight:700}
.reward .em{font-size:40px;line-height:1.1}
.result .actions{width:100%;max-width:360px}

/* Màn hình chung */
.page{padding:18px 16px 20px}
.page h1{font-size:30px;margin:0 0 4px;line-height:1.15}
.page .lead{color:var(--muted);margin:0 0 16px;font-weight:600}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:21px;margin:0 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat small{color:var(--muted);font-weight:600;font-size:15px}
.skill{margin:8px 0}
.skill-top{display:flex;justify-content:space-between;font-size:16px;font-weight:700}
.skill-top span:last-child{color:var(--muted)}
.skill .goal-bar i.mid{background:var(--sun)}.skill .goal-bar i.low{background:var(--berry)}
.week-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;margin-top:6px}
.wb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:13px;font-weight:700;color:var(--muted)}
.wb i{display:block;width:70%;background:var(--sky);border-radius:8px 8px 3px 3px;min-height:4px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:8px 0;border-top:2px solid var(--soft)}.row>div:first-child{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.row:first-of-type{border-top:0}
.row div small{display:block;color:var(--muted);font-size:14px;font-weight:600;line-height:1.3}
.switch{flex:none;width:58px;height:34px;border-radius:99px;border:0;background:var(--lock);position:relative}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"]::after{left:28px}
.small-btn{flex:none;white-space:nowrap;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:4px 12px;font-weight:800;font-size:16px}
.small-btn.danger{color:var(--berry);border-color:var(--berry)}
.tip{background:var(--soft);border-radius:14px;padding:10px 14px;font-weight:600;font-size:17px}
.rp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:2px solid var(--soft)}
.rp-n{font-weight:700;font-size:15px;line-height:1.3;min-width:0}.rp-n small{display:block;font-weight:600;color:var(--muted);font-size:13px;margin-top:2px}
.rp-r{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end}.rp-r small{color:var(--muted);font-size:13px;font-weight:600}
.rp-st{color:var(--sun);font-size:17px;letter-spacing:1px;white-space:nowrap}
.rp-subj{margin:6px 0 16px;padding-bottom:6px;border-bottom:2px dashed var(--soft)}.rp-subj>.skill-top{font-size:18px}.rp-subj .skill{margin-left:10px}.rp-subj small{color:var(--muted);font-weight:600}

/* Sticker */
.st-week{margin-bottom:16px}
.st-week h2{font-size:19px;margin:0 0 6px;color:var(--muted)}
.st-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.st{aspect-ratio:1;border-radius:16px;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px}
.st.no{color:var(--lock);font-size:24px;font-weight:800;background:var(--soft);border-style:dashed}

/* Siêu tốc */
.speed-intro{text-align:center;padding:30px 22px}
.speed-intro .bolt{font-size:90px;line-height:1}
.speed-intro h1{font-size:34px;margin:6px 0}
.speed-intro p{color:var(--muted);font-weight:600;margin:0 0 8px}
.record{display:inline-block;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 16px;font-weight:800;margin:6px 0 22px}
.qbody.center{display:flex;align-items:center;justify-content:center;flex-direction:column}
.huge{font-size:58px}
.flash-bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Khởi đầu */
.onboard{padding:30px 22px;text-align:center}
.onboard .owl{font-size:90px;transform:none}
.onboard h1{font-size:34px;margin:4px 0}
.onboard p{color:var(--muted);font-weight:600;margin:0 0 18px}
.field{width:100%;font:inherit;font-size:24px;font-weight:700;text-align:center;border:2.5px solid var(--line);border-radius:16px;padding:10px;background:var(--card);color:var(--ink)}
.avas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 24px}
.ava-btn{font-size:40px;border-radius:18px;border:2.5px solid var(--line);background:var(--card);padding:6px 0;box-shadow:0 4px 0 var(--line)}
.ava-btn[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 4px 0 var(--sky-d);background:var(--soft)}
.label{display:block;text-align:left;font-weight:800;margin:0 0 6px}

/* Hộp thoại, thông báo */
.modal{position:fixed;inset:0;background:rgba(10,20,45,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal-card{max-height:90%;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:24px;padding:20px;width:100%;max-width:440px;margin-bottom:env(safe-area-inset-bottom,0px);text-align:center}
.modal-card h2{margin:0 0 4px;font-size:26px;line-height:1.2}
.modal-card p{margin:0 0 16px;color:var(--muted);font-weight:600}
.modal-card .big-ic{font-size:60px;line-height:1.1}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:14px;font-weight:700;z-index:60;max-width:90%;text-align:center}
.stk{
position:relative;display:inline-flex;align-items:center;justify-content:center;
width:58px;height:58px;border-radius:21px;
background:
 radial-gradient(circle at 28% 20%,rgba(255,255,255,.98) 0 7%,transparent 8%),
 linear-gradient(145deg,#fff 0%,color-mix(in srgb,var(--sc) 78%,#fff) 34%,var(--sc) 100%);
 border:3px solid #fff;
 box-shadow:
  0 0 0 2px color-mix(in srgb,var(--sc) 45%,#fff),

<script>
"use strict";
/* ============ TIỆN ÍCH ============ */
const $=s=>document.querySelector(s);
const app=document.getElementById('app');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const dayStr=(off=0)=>{const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
const todayStr=()=>dayStr(0);

/* ============ ĐỌC SỐ TIẾNG VIỆT ============ */
const DG=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function readTens(r){if(r<10)return DG[r];const t=Math.floor(r/10),u=r%10;const tens=t===1?'mười':DG[t]+' mươi';if(u===0)return tens;let un=DG[u];if(u===1&&t>1)un='mốt';if(u===5)un='lăm';return tens+' '+un;}
function readNum(n){if(n===0)return'không';if(n===1000)return'một nghìn';const h=Math.floor(n/100),r=n%100;if(h===0)return readTens(r);let s=DG[h]+' trăm';if(r===0)return s;if(r<10)return s+' linh '+DG[r];return s+' '+readTens(r);}

/* ============ TẠO CÂU HỎI ============ */
function mc(skill,prompt,answer,wrong,extra={}){answer=String(answer);let options;if(extra.fixed)options=extra.fixed.slice();else{const set=[answer];wrong.map(String).forEach(w=>{if(!set.includes(w))set.push(w);});options=shuffle(set);}return Object.assign({type:'mc',skill,prompt,answer,options},extra);}
function inp(skill,prompt,answer,extra={}){return Object.assign({type:'input',skill,prompt,answer:Number(answer)},extra);}
function ord(skill,prompt,answer,extra={}){let items=shuffle(answer);let t=0;while(items.join('|')===answer.join('|')&&t<10){items=shuffle(answer);t++;}return Object.assign({type:'order',skill,prompt,answer,items},extra);}
function nearNums(n,k,cands,min=0,max=100000){const set=new Set();for(const c of shuffle(cands)){if(c>=min&&c<max&&c!==n)set.add(c);if(set.size>=k)break;}let t=1;while(set.size<k){const c=n+t*3;if(c!==n&&c>=min)set.add(c);t++;}return[...set];}
const revNum=n=>Number(String(n).split('').reverse().join(''));
function carries(a,b){let c=0,k=0;while(a||b){const s=a%10+b%10+k;k=s>=10?1:0;c+=k;a=Math.floor(a/10);b=Math.floor(b/10);}return c;}
function borrows(a,b){let c=0,k=0;while(a||b){const d=a%10-b%10-k;k=d<0?1:0;c+=k;a=Math.floor(a/10);b=Math.floor(b/10);}return c;}
function pairAdd(mode){let a,b;if(mode==='nc'){const a1=rnd(1,7),b1=rnd(1,8-a1),a0=rnd(0,8),b0=rnd(0,9-a0);return[a1*10+a0,b1*10+b0];}if(mode==='c'){do{a=rnd(15,79);b=rnd(6,49);}while(a%10+b%10<10||a+b>=100);return[a,b];}do{a=rnd(120,599);b=rnd(110,399);}while(a+b>=1000||carries(a,b)>1);return[a,b];}
function pairSub(mode){let a,b;if(mode==='nc'){const a1=rnd(3,9),b1=rnd(1,a1-1),a0=rnd(1,9),b0=rnd(0,a0);return[a1*10+a0,b1*10+b0];}if(mode==='c'){do{a=rnd(30,99);b=rnd(6,a-10);}while(a%10>=b%10);return[a,b];}do{a=rnd(300,999);b=rnd(110,a-100);}while(borrows(a,b)>1);return[a,b];}

const NAMES=['An','Bình','Lan','Mai','Hà','Nam','Minh','Hoa','Tú','Khoa','Vy','Bảo'];
const THINGS=[['viên bi','🔵'],['quyển truyện','📘'],['bông hoa','🌼'],['quả cam','🍊'],['cái kẹo','🍬'],['con tem','💌'],['chiếc lá','🍃'],['nhãn vở','🏷️']];

function clockSVG(h,m){let nums='';for(let k=1;k<=12;k++){const a=(k*30-90)*Math.PI/180;nums+=`<text x="${(100+70*Math.cos(a)).toFixed(1)}" y="${(100+70*Math.sin(a)+7).toFixed(1)}" text-anchor="middle" font-size="20" font-weight="800" fill="currentColor" font-family="inherit">${k}</text>`;}
const ha=((h%12)+m/60)*30,ma=m*6;
return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="Mặt đồng hồ"><circle cx="100" cy="100" r="92" fill="var(--card)" stroke="var(--sky)" stroke-width="8"/>${nums}<line x1="100" y1="100" x2="100" y2="54" stroke="var(--berry)" stroke-width="9" stroke-linecap="round" transform="rotate(${ha} 100 100)"/><line x1="100" y1="100" x2="100" y2="30" stroke="currentColor" stroke-width="5" stroke-linecap="round" transform="rotate(${ma} 100 100)"/><circle cx="100" cy="100" r="7" fill="currentColor"/></svg>`;}
function polySVG(a,b,c){const P=[[24,132],[98,42],[182,122],[258,36]],L=['A','B','C','D'];let s=`<svg class="poly" viewBox="0 0 285 165" role="img" aria-label="Đường gấp khúc ABCD"><polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--sky)" stroke-width="5" stroke-linejoin="round"/>`;
P.forEach((p,k)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="currentColor"/><text x="${p[0]}" y="${p[1]+(k%2?-12:26)}" text-anchor="middle" font-weight="800" font-size="18" fill="currentColor" font-family="inherit">${L[k]}</text>`;});
const off=[[-30,0],[10,28],[36,6]];[a,b,c].forEach((v,k)=>{const x=(P[k][0]+P[k+1][0])/2+off[k][0],y=(P[k][1]+P[k+1][1])/2+off[k][1];s+=`<text x="${x}" y="${y}" text-anchor="middle" font-weight="800" font-size="17" fill="var(--berry)" font-family="inherit">${v} cm</text>`;});return s+'</svg>';}

const M={
  readNum(min,max){const n=rnd(min+1,max-1);const r=revNum(n);const w=nearNums(n,2,[r,n+10,n-10,n+1,n-1,n+100],min,max);return mc('so',`Số nào được đọc là: “${readNum(n)}”?`,n,w);},
  writeWords(min,max){const n=rnd(min+1,max-1);const w=nearNums(n,2,[n+1,n-1,n+10,n-10,revNum(n)],min+1,max);return mc('so',`Số ${n} được đọc là:`,readNum(n),w.map(readNum));},
  compare(min,max){let a=rnd(min,max-1),b;const r=Math.random();if(r<.2)b=a;else if(r<.5){b=revNum(a);if(b===a||b<min||b>=max)b=Math.min(max-1,a+rnd(1,9));}else b=rnd(min,max-1);let bt=String(b);if(max<=100&&b>=20&&b%10&&Math.random()<.35)bt=`${b-b%10} + ${b%10}`;const s=a>b?'>':a<b?'<':'=';return mc('so','Chọn dấu thích hợp điền vào ô trống:',s,[],{fixed:['>','<','='],big:`${a} ☐ ${bt}`});},
  neighbor(max){const n=rnd(11,max-2);return Math.random()<.5?inp('so',`Số liền sau của ${n} là số nào?`,n+1,{explain:`Số liền sau hơn số đó 1 đơn vị: ${n} + 1 = ${n+1}`}):inp('so',`Số liền trước của ${n} là số nào?`,n-1,{explain:`Số liền trước kém số đó 1 đơn vị: ${n} − 1 = ${n-1}`});},
  sort(min,max){const s=new Set();const base=rnd(min,max-1);s.add(base);const r=revNum(base);if(r>=min&&r<max)s.add(r);while(s.size<4)s.add(rnd(min,max-1));const arr=[...s].slice(0,4);const asc=Math.random()<.6;const ans=arr.sort((a,b)=>asc?a-b:b-a).map(String);return ord('so',`Xếp các số theo thứ tự từ ${asc?'bé đến lớn':'lớn đến bé'}:`,ans);},
  addNoCarry(){const[a,b]=pairAdd('nc');return inp('congtru','Tính:',a+b,{big:`${a} + ${b} = ?`,explain:`Cộng từ phải sang trái: đơn vị ${a%10} + ${b%10} = ${a%10+b%10}; chục ${Math.floor(a/10)} + ${Math.floor(b/10)} = ${Math.floor(a/10)+Math.floor(b/10)}`});},
  subNoCarry(){const[a,b]=pairSub('nc');return inp('congtru','Tính:',a-b,{big:`${a} − ${b} = ?`,explain:`Trừ từ phải sang trái: đơn vị ${a%10} − ${b%10} = ${a%10-b%10}; chục ${Math.floor(a/10)} − ${Math.floor(b/10)} = ${Math.floor(a/10)-Math.floor(b/10)}`});},
  addCarry(){const[a,b]=pairAdd('c');const u=a%10+b%10;return inp('congtru','Tính:',a+b,{big:`${a} + ${b} = ?`,explain:`${a%10} + ${b%10} = ${u}, viết ${u%10} nhớ 1.\n${Math.floor(a/10)} + ${Math.floor(b/10)} = ${Math.floor(a/10)+Math.floor(b/10)}, thêm 1 bằng ${Math.floor(a/10)+Math.floor(b/10)+1}, viết ${Math.floor(a/10)+Math.floor(b/10)+1}.`});},
  subCarry(){const[a,b]=pairSub('c');const u=a%10+10-b%10;return inp('congtru','Tính:',a-b,{big:`${a} − ${b} = ?`,explain:`${a%10} không trừ được ${b%10}, lấy ${a%10+10} trừ ${b%10} bằng ${u}, viết ${u} nhớ 1.\n${Math.floor(b/10)} thêm 1 bằng ${Math.floor(b/10)+1}; ${Math.floor(a/10)} trừ ${Math.floor(b/10)+1} bằng ${Math.floor(a/10)-Math.floor(b/10)-1}.`});},
  facts20(){if(Math.random()<.5){const a=rnd(4,9),b=rnd(11-a,9);return inp('congtru','Tính nhẩm:',a+b,{big:`${a} + ${b} = ?`,explain:`Tách để được 10: ${a} + ${10-a} = 10, 10 + ${b-(10-a)} = ${a+b}`});}const s=rnd(11,18),b=rnd(s-9,9);return inp('congtru','Tính nhẩm:',s-b,{big:`${s} − ${b} = ?`,explain:`Vì ${s-b} + ${b} = ${s} nên ${s} − ${b} = ${s-b}`});},
  missingAdd(){const c=rnd(30,99),b=rnd(5,c-5);return inp('congtru','Tìm số còn thiếu:',c-b,{big:`? + ${b} = ${c}`,explain:`Muốn tìm số hạng, lấy tổng trừ số hạng kia: ${c} − ${b} = ${c-b}`});},
  missingSub(){const a=rnd(40,99),b=rnd(5,a-5);return inp('congtru','Tìm số còn thiếu:',b,{big:`${a} − ? = ${a-b}`,explain:`Muốn tìm số trừ, lấy số bị trừ trừ hiệu: ${a} − ${a-b} = ${b}`});},
  chain(){if(Math.random()<.5){const a=rnd(20,55),b=rnd(10,39),c=rnd(5,a+b-5);return inp('congtru','Tính từ trái sang phải:',a+b-c,{big:`${a} + ${b} − ${c} = ?`,explain:`${a} + ${b} = ${a+b}\n${a+b} − ${c} = ${a+b-c}`});}const x=rnd(50,90),y=rnd(10,x-10),z=rnd(5,30);return inp('congtru','Tính từ trái sang phải:',x-y+z,{big:`${x} − ${y} + ${z} = ?`,explain:`${x} − ${y} = ${x-y}\n${x-y} + ${z} = ${x-y+z}`});},
  wp(kind,mode){let a,b,ans,text,line,expr,t,ic;
    if(mode==='k'){if(kind==='total'){[a,b]=pairAdd('k');t='học sinh';ic='🏫';ans=a+b;text=`Trường em có ${a} học sinh nữ và ${b} học sinh nam. Hỏi trường có tất cả bao nhiêu học sinh?`;line='Trường em có tất cả số học sinh là:';expr=`${a} + ${b}`;}
      else{[a,b]=pairSub('k');t='quả trứng';ic='🥚';ans=a-b;text=`Cửa hàng có ${a} quả trứng, đã bán ${b} quả. Hỏi cửa hàng còn lại bao nhiêu quả trứng?`;line='Cửa hàng còn lại số quả trứng là:';expr=`${a} − ${b}`;}}
    else{const n1=pick(NAMES);let n2;do{n2=pick(NAMES);}while(n2===n1);[t,ic]=pick(THINGS);
      if(kind==='total'){[a,b]=pairAdd(mode);ans=a+b;text=`${n1} có ${a} ${t}, ${n2} có ${b} ${t}. Hỏi cả hai bạn có tất cả bao nhiêu ${t}?`;line=`Cả hai bạn có số ${t} là:`;expr=`${a} + ${b}`;}
      else if(kind==='remain'){[a,b]=pairSub(mode);ans=a-b;text=`${n1} có ${a} ${t}. ${n1} cho bạn ${b} ${t}. Hỏi ${n1} còn lại bao nhiêu ${t}?`;line=`${n1} còn lại số ${t} là:`;expr=`${a} − ${b}`;}
      else if(kind==='more'){[a,b]=pairAdd(mode);ans=a+b;text=`${n1} có ${a} ${t}. ${n2} có nhiều hơn ${n1} ${b} ${t}. Hỏi ${n2} có bao nhiêu ${t}?`;line=`${n2} có số ${t} là:`;expr=`${a} + ${b}`;}
      else{[a,b]=pairSub(mode);ans=a-b;text=`${n1} có ${a} ${t}. ${n2} có ít hơn ${n1} ${b} ${t}. Hỏi ${n2} có bao nhiêu ${t}?`;line=`${n2} có số ${t} là:`;expr=`${a} − ${b}`;}}
    return inp('giaitoan',text,ans,{icon:ic,unit:t,explain:`Bài giải\n${line}\n${expr} = ${ans} (${t})\nĐáp số: ${ans} ${t}.`});},
  sumToProd(){const k=pick([2,5]),n=rnd(2,6);return inp('nhanchia','Chuyển tổng thành phép nhân:',n,{big:`${Array(n).fill(k).join(' + ')} = ${k} × ?`,explain:`Số ${k} được lấy ${n} lần, nên ${k} × ${n} = ${k*n}`});},
  mul(){const k=pick([2,5]),n=rnd(1,10);return Math.random()<.8?inp('nhanchia','Tính:',k*n,{big:`${k} × ${n} = ?`,explain:`Bảng nhân ${k}: ${k} × ${n} = ${k*n}`}):inp('nhanchia','Tính:',k*n,{big:`${n} × ${k} = ?`,explain:`Đổi chỗ các thừa số, tích không đổi: ${n} × ${k} = ${k} × ${n} = ${k*n}`});},
  mulMissing(){const k=pick([2,5]),n=rnd(2,10);return inp('nhanchia','Tìm số còn thiếu:',n,{big:`${k} × ? = ${k*n}`,explain:`Nhớ bảng nhân ${k}: ${k} × ${n} = ${k*n}`});},
  groups(){const k=pick([2,5]),n=rnd(2,5);const ic=pick(['🍎','⭐','🐟','🌸','🍓']);const vis=`<div class="groups">${Array(n).fill(0).map(()=>`<span class="grp">${ic.repeat(k)}</span>`).join('')}</div>`;return inp('nhanchia',`Có ${n} nhóm, mỗi nhóm ${k} ${ic}. Có tất cả bao nhiêu ${ic}?`,k*n,{visual:vis,explain:`${k} được lấy ${n} lần: ${k} × ${n} = ${k*n}`});},
  wpMul(){const k=pick([2,5]),n=rnd(2,10);const L=k===2?[['con gà','cái chân','🐔'],['đôi đũa','chiếc đũa','🥢'],['bạn','cái tai','👂']]:[['bàn tay','ngón tay','✋'],['bông hoa','cánh hoa','🌸'],['túi','quả cam','🍊']];const[c,t,ic]=pick(L);const text=`Mỗi ${c} có ${k} ${t}. Hỏi ${n} ${c} như thế có bao nhiêu ${t}?`;return inp('giaitoan',text,k*n,{icon:ic,unit:t,explain:`Bài giải\n${n} ${c} có số ${t} là:\n${k} × ${n} = ${k*n} (${t})\nĐáp số: ${k*n} ${t}.`});},
  div(){const k=pick([2,5]),n=rnd(1,10);return inp('nhanchia','Tính:',n,{big:`${k*n} : ${k} = ?`,explain:`Vì ${k} × ${n} = ${k*n} nên ${k*n} : ${k} = ${n}`});},
  mulDivRel(){const k=pick([2,5]),n=rnd(2,10),p=k*n;return Math.random()<.5?inp('nhanchia',`Biết ${k} × ${n} = ${p}. Vậy:`,n,{big:`${p} : ${k} = ?`,explain:`Lấy tích chia cho thừa số này được thừa số kia: ${p} : ${k} = ${n}`}):inp('nhanchia',`Biết ${k} × ${n} = ${p}. Vậy:`,k,{big:`${p} : ${n} = ?`,explain:`Lấy tích chia cho thừa số này được thừa số kia: ${p} : ${n} = ${k}`});},
  wpDiv(){const k=pick([2,5]),n=rnd(2,10);const[t,ic]=pick([['cái bánh','🍪'],['quyển vở','📒'],['quả táo','🍎'],['bông hoa','🌷']]);const c=pick(['hộp','đĩa','bạn']);
    if(Math.random()<.5){const text=c==='bạn'?`Có ${k*n} ${t} chia đều cho ${k} bạn. Hỏi mỗi bạn được mấy ${t}?`:`Có ${k*n} ${t} chia đều vào ${k} ${c}. Hỏi mỗi ${c} có mấy ${t}?`;return inp('giaitoan',text,n,{icon:ic,unit:t,explain:`Bài giải\nMỗi ${c} có số ${t} là:\n${k*n} : ${k} = ${n} (${t})\nĐáp số: ${n} ${t}.`});}
    const c2=c==='bạn'?'hộp':c;return inp('giaitoan',`Có ${k*n} ${t}, xếp vào mỗi ${c2} ${k} ${t}. Hỏi xếp được mấy ${c2}?`,n,{icon:ic,unit:c2,explain:`Bài giải\nSố ${c2} xếp được là:\n${k*n} : ${k} = ${n} (${c2})\nĐáp số: ${n} ${c2}.`});},
  place(){const h=rnd(1,9),t=rnd(0,9),u=rnd(0,9),n=h*100+t*10+u;const which=pick(['h','t','u']);const d=which==='h'?h:which==='t'?t:u;
    if(Math.random()<.5||d===0)return inp('so',`Số gồm ${h} trăm, ${t} chục và ${u} đơn vị là:`,n,{explain:`${h} trăm = ${h*100}, ${t} chục = ${t*10}, ${u} đơn vị = ${u}. Ghép lại: ${n}`});
    const val=which==='h'?d*100:which==='t'?d*10:d;return mc('so',`Trong số ${n}, chữ số ${d} ở hàng ${which==='h'?'trăm':which==='t'?'chục':'đơn vị'} có giá trị là:`,val,[d,d*10,d*100].filter(x=>x!==val));},
  add1000(){const[a,b]=pairAdd('k');return inp('congtru','Tính:',a+b,{big:`${a} + ${b} = ?`,explain:`Cộng lần lượt từ hàng đơn vị, hàng chục đến hàng trăm. Nhớ 1 nếu tổng một hàng từ 10 trở lên.`});},
  sub1000(){const[a,b]=pairSub('k');return inp('congtru','Tính:',a-b,{big:`${a} − ${b} = ?`,explain:`Trừ lần lượt từ hàng đơn vị, hàng chục đến hàng trăm. Nếu không trừ được thì mượn 1 chục (hoặc 1 trăm).`});},
  convert(){const items=[['1 m','dm',10],['1 dm','cm',10],['1 m','cm',100],['1 giờ','phút',60],['1 ngày','giờ',24]];if(Math.random()<.5){const[a,u,v]=pick(items);return inp('doluong','Điền số thích hợp:',v,{big:`${a} = ? ${u}`,explain:`${a} = ${v} ${u}`});}const k=rnd(2,9);return Math.random()<.5?inp('doluong','Điền số thích hợp:',k*10,{big:`${k} dm = ? cm`,explain:`1 dm = 10 cm nên ${k} dm = ${k*10} cm`}):inp('doluong','Điền số thích hợp:',k*10,{big:`${k} m = ? dm`,explain:`1 m = 10 dm nên ${k} m = ${k*10} dm`});},
  polyline(){const a=rnd(5,20),b=rnd(5,20),c=rnd(5,20);return inp('doluong','Tính độ dài đường gấp khúc ABCD:',a+b+c,{visual:polySVG(a,b,c),unit:'cm',explain:`Cộng độ dài các đoạn thẳng: ${a} + ${b} + ${c} = ${a+b+c} (cm)`});},
  clock(){const h=rnd(1,12),m=pick([0,15,30]);const lbl=(h,m)=>m===0?`${h} giờ`:`${h} giờ ${m} phút`;const ans=lbl(h,m);const w=new Set();let g=0;while(w.size<2&&g<50){g++;const hh=Math.random()<.5?h:(h%12)+1;const mm=pick([0,15,30]);const l=lbl(hh,mm);if(l!==ans)w.add(l);}return mc('doluong','Đồng hồ chỉ mấy giờ?',ans,[...w],{visual:clockSVG(h,m),explain:`Kim ngắn (màu đỏ) chỉ giờ, kim dài chỉ phút. Kim dài chỉ số 3 là 15 phút, chỉ số 6 là 30 phút.`});},
  money(){const items=[['quyển vở',10],['cái bút',5],['cục tẩy',2],['cái thước',5],['hộp màu',20],['quả bóng',50],['gói bánh',10]];const[a,pa]=pick(items);let b,pb;do{[b,pb]=pick(items);}while(b===a);return inp('doluong',`Mua 1 ${a} giá ${pa} 000 đồng và 1 ${b} giá ${pb} 000 đồng. Hỏi phải trả tất cả bao nhiêu nghìn đồng?`,pa+pb,{icon:'💰',unit:'nghìn đồng',explain:`${pa} 000 + ${pb} 000 = ${pa+pb} 000 (đồng)`});},
  shape(){const L=[['⚽ Quả bóng','khối cầu'],['🥫 Lon nước','khối trụ'],['🌍 Quả địa cầu','khối cầu'],['🪵 Khúc gỗ tròn','khối trụ'],['🖼️ Khung tranh','hình tứ giác'],['📱 Mặt điện thoại','hình tứ giác'],['🍊 Quả cam','khối cầu'],['🥁 Cái trống','khối trụ']];const[o,a]=pick(L);return mc('doluong',`${o} có dạng hình gì?`,a,[],{fixed:['khối cầu','khối trụ','hình tứ giác']});},
  kgL(){if(Math.random()<.5){const a=rnd(10,40),b=rnd(5,30);return inp('doluong',`Bao gạo nặng ${a} kg, bao đường nặng ${b} kg. Hỏi cả hai bao nặng bao nhiêu ki-lô-gam?`,a+b,{icon:'⚖️',unit:'kg',explain:`Bài giải\nCả hai bao nặng là:\n${a} + ${b} = ${a+b} (kg)\nĐáp số: ${a+b} kg.`});}const a=rnd(10,20),b=rnd(2,a-1);return inp('doluong',`Can có ${a} lít nước, đã rót ra ${b} lít. Hỏi can còn lại bao nhiêu lít nước?`,a-b,{icon:'🧴',unit:'lít',explain:`Bài giải\nCan còn lại số lít nước là:\n${a} − ${b} = ${a-b} (lít)\nĐáp số: ${a-b} lít.`});},
  prob(){const L=[['Hộp chỉ có bi đỏ. Lấy ra một viên bi, …… lấy được bi đỏ.','chắc chắn'],['Hộp chỉ có bi đỏ. Lấy ra một viên bi, …… lấy được bi xanh.','không thể'],['Hộp có cả bi đỏ và bi xanh. Lấy ra một viên bi, …… lấy được bi xanh.','có thể'],['Tung một đồng xu, …… được mặt sấp.','có thể'],['Mặt Trời …… mọc ở hướng tây.','không thể']];const[q,a]=pick(L);return mc('so',`Chọn từ thích hợp điền vào chỗ chấm: ${q}`,a,[],{fixed:['chắc chắn','có thể','không thể']});}
};

const CATS={sv:['sự vật',SV],hd:['hoạt động',HD],dd:['đặc điểm',DDI]};
const STYPES=[['Câu giới thiệu (Ai là gì?)',LAGI],['Câu nêu hoạt động (Ai làm gì?)',LAMGI],['Câu nêu đặc điểm (Ai thế nào?)',THENAO]];
const TV={
  word(w){const focus=w===0?'sv':w===1?'hd':w===2?'dd':pick(['sv','hd','dd']);
    if(w<3||Math.random()<.5){const ans=pick(CATS[focus][1]);const others=Object.keys(CATS).filter(k=>k!==focus).map(k=>pick(CATS[k][1]));return mc('tucau',`Từ nào là từ chỉ ${CATS[focus][0]}?`,ans,others,{explain:`“${ans}” là từ chỉ ${CATS[focus][0]}.`});}
    const k=pick(Object.keys(CATS));const wd=pick(CATS[k][1]);return mc('tucau',`Từ “${wd}” là từ chỉ gì?`,'Chỉ '+CATS[k][0],[],{fixed:['Chỉ sự vật','Chỉ hoạt động','Chỉ đặc điểm']});},
  sentType(w){const avail=w===0?[0]:w===1?[0,1]:[0,1,2];
    if(w<=1&&Math.random()<.6){const ti=avail[avail.length-1];const ans=pick(STYPES[ti][1]);const others=[0,1,2].filter(x=>x!==ti).map(x=>pick(STYPES[x][1]));return mc('tucau',`Câu nào là ${STYPES[ti][0].charAt(0).toLowerCase()+STYPES[ti][0].slice(1)}?`,ans,others);}
    const ti=pick(avail);const s=pick(STYPES[ti][1]);return mc('tucau',`Câu “${s}” thuộc kiểu câu nào?`,STYPES[ti][0],[],{fixed:STYPES.map(t=>t[0])});},
  arrange(){const a=pick(ARR);return ord('doanvan','Sắp xếp các từ thành câu đúng:',a);},
  punct(){const[s,a]=pick(PUNCT);return mc('daucau','Chọn dấu câu thích hợp điền vào ô trống:',a,[],{fixed:['.','?','!'],big:`${s} ☐`,bigSmall:true,explain:a==='?'?'Câu hỏi dùng dấu chấm hỏi.':a==='!'?'Câu bộc lộ cảm xúc dùng dấu chấm than.':'Câu kể dùng dấu chấm.'});},
  comma(){const[ok,wr]=pick(COMMA);return mc('daucau','Câu nào dùng dấu phẩy đúng?',ok,wr,{explain:'Dấu phẩy dùng để ngăn cách các từ cùng loại đứng liền nhau.'});},
  caps(){const[ok,wr]=pick(CAPS);return mc('daucau','Câu nào viết hoa đúng?',ok,wr,{explain:'Viết hoa chữ đầu câu và tên riêng của người, địa danh.'});},
  spell(w){const[wd,wr]=pick(SPELL[w]);const s=SAYCTX[wd]||wd;const i=s.toLowerCase().indexOf(wd);const bl=i<0?'':esc(s.slice(0,i))+'<span class="blank">'+'_'.repeat(6)+'</span>'+esc(s.slice(i+wd.length));return mc('chinhta','Nghe đọc và chọn cách viết đúng của từ còn thiếu:',wd,wr,{say:s,visual:bl?`<div class="ctx">${bl}</div>`:''});},
  paragraph(){const p=pick(PARA);return ord('doanvan','Sắp xếp các câu thành đoạn văn hợp lí:',p);},
  ending(){const[ok,wr]=pick(ENDS);return mc('doanvan','Câu nào phù hợp để kết thúc đoạn văn (nêu cảm nghĩ)?',ok,wr,{explain:'Câu kết đoạn thường nêu tình cảm, cảm nghĩ của em.'});}
};
const readQ=(w,i)=>{const R=READ[w];const[q,a,wr]=R.qs[i];return mc('dochieu',q,a,wr,{passage:R});};
const kpQ=w=>{const[q,a,wr]=pick(KP[w]);return mc('khampha',q,a,wr);};

function tvThunks(w,d){
  switch(d){
    case 0:return[()=>readQ(w,0),()=>readQ(w,1),()=>TV.word(w)];
    case 1:return[()=>TV.spell(w),()=>TV.spell(w),()=>TV.spell(w)];
    case 2:if(w<=2)return[()=>TV.word(w),()=>TV.word(w),()=>TV.sentType(w)];if(w===3)return[TV.punct,TV.punct,()=>TV.word(w)];if(w===4)return[TV.comma,TV.caps,()=>TV.sentType(w)];return[()=>TV.word(w),()=>TV.sentType(w),()=>pick([TV.punct,TV.comma,TV.caps])()];
    case 3:return[()=>readQ(w,2),()=>readQ(w,3),()=>TV.sentType(w)];
    case 4:if(w<=2)return[TV.arrange,TV.arrange,()=>TV.sentType(w)];if(w===3)return[TV.punct,TV.arrange,()=>TV.word(w)];if(w===4)return[TV.comma,TV.caps,TV.arrange];return[TV.paragraph,TV.ending,TV.arrange];
    default:return[()=>TV.spell(w),()=>TV.word(w),()=>(w>=3?pick([TV.punct,()=>TV.sentType(w)])():TV.sentType(w)),()=>readQ(w,rnd(0,3))];
  }
}
const qKey=q=>q.prompt+'|'+(q.big||'')+'|'+(Array.isArray(q.answer)?q.answer.join():q.answer);
function uniqList(thunks){const out=[],keys=new Set();for(const t of thunks){let q,i=0;do{q=t();i++;}while(keys.has(qKey(q))&&i<15);keys.add(qKey(q));out.push(q);}return out;}
function bankThunks(w,d,nm,nested){const pool=shuffle(nested?MATH_BANK[w][d]:MATH_BANK[w]);return pool.slice(0,nested?nm:nm+6).map(q=>()=>JSON.parse(JSON.stringify(q)));}
const LESSON_Q=15;/* mỗi bài 15 câu: 12 câu trong ngân hàng + 3 câu thử thách */
const QPL=10;
function prep(a){return a.map(q=>{q=JSON.parse(JSON.stringify(q));if(q.type==='order'){let it=shuffle(q.answer),t=0;while(it.join('|')===q.answer.join('|')&&t<20){it=shuffle(q.answer);t++;}q.items=it;}return q;});}
function buildLevel(w,d){const ch=chMath(w,d);return prep(shuffle(MATH_BANK[w][d]).slice(0,Math.max(1,LESSON_Q-ch.length))).concat(ch).slice(0,LESSON_Q);}

function buildTv0(u,d,cap){const B=prep(shuffle(TV_BANK[u][d]).slice(0,cap||QPL));const p=B.filter(q=>q.passage).sort((a,b)=>a.passage.title<b.passage.title?-1:a.passage.title>b.passage.title?1:0);return p.concat(B.filter(q=>!q.passage));}
function buildTv(u,d){const ch=chTv(u,d);return buildTv0(u,d,Math.max(1,LESSON_Q-ch.length)).concat(ch).slice(0,LESSON_Q);}/* 15 câu/bài: 12 + 3 thử thách */
const EP={what:'Đây là gì?',pic:'Chọn hình đúng với từ',mean:'Từ này nghĩa là gì?',letter:'Điền chữ cái còn thiếu',smean:'Câu này nghĩa là gì?'};
const others=(arr,x,n)=>shuffle(arr.filter(a=>a!==x)).slice(0,n);
const E={
  picWord(u){const W=EN_UNITS[u].w,w=pick(W);return mc('en_vocab',EP.what+'',w[0],others(W,w,2).map(o=>o[0]),{visual:`<div class="emo">${w[1]}</div>`,voice:[['vi',EP.what]]});},
  wordPic(u){const W=EN_UNITS[u].w,w=pick(W);return mc('en_vocab',EP.pic+':',w[1],others(W,w,2).map(o=>o[1]),{big:w[0],emo:true,voice:[['vi',EP.pic],['en',w[0]]],explain:`${w[0]} ${w[1]} = ${w[2]}`});},
  meaning(u){const W=EN_UNITS[u].w,w=pick(W);return mc('en_vocab',EP.mean,w[2],others(W,w,2).map(o=>o[2]),{big:w[0],voice:[['vi',EP.mean],['en',w[0]]]});},
  listenWord(u){const W=EN_UNITS[u].w,w=pick(W);return mc('en_listen','Nghe và chọn từ đúng:',w[0],others(W,w,2).map(o=>o[0]),{voice:[['en',w[0]]],auto:true,explain:`${w[0]} ${w[1]} = ${w[2]}`});},
  listenSent(u){const C=EN_UNITS[u].c,c=pick(C);return mc('en_listen','Nghe câu và chọn hình đúng:',c[2],others(C,c,2).map(o=>o[2]),{emo:true,voice:[['en',c[0]]],auto:true,explain:`${c[0]} = ${c[1]}`});},
  letter(u){const W=EN_UNITS[u].w,w=pick(W);const DG=['qu','sh','th','ch'];const pre=DG.find(d=>w[0].startsWith(d))||w[0][0];const pool=pre.length===2?DG:'bcdfghjklmnprstvwyz'.split('');const wr=shuffle(pool.filter(x=>x!==pre)).slice(0,2);return mc('en_listen',EP.letter+':',pre,wr,{big:'_'.repeat(pre.length)+w[0].slice(pre.length),visual:`<div class="emo sm">${w[1]}</div>`,voice:[['vi',EP.letter],['en',w[0]]],explain:`${w[0]} = ${w[2]}`});},
  arrange(u){const C=EN_UNITS[u].c.filter(c=>c[0].split(' ').length>=3);const c=pick(C.length?C:EN_UNITS[u].c);return ord('en_sent','Nghe và sắp xếp thành câu đúng:',c[0].split(' '),{voice:[['en',c[0]]],auto:true,explain:`${c[0]} = ${c[1]}`});},
  sentMeaning(u){const C=EN_UNITS[u].c,c=pick(C);return mc('en_sent',EP.smean,c[1],others(C,c,2).map(o=>o[1]),{big:c[0],bigSmall:true,voice:[['vi',EP.smean],['en',c[0]]]});}
};
function buildEn0(u,d,cap){return prep(shuffle(EN_BANK[u][d]).slice(0,cap||QPL));}
function buildEn(u,d){const ch=chEn(u,d);return buildEn0(u,d,Math.max(1,LESSON_Q-ch.length)).concat(ch).slice(0,LESSON_Q);}/* 15 câu/bài */

const M3={

  place4(){const n=rnd(1001,99999);const s=String(n);const pos=rnd(0,s.length-1);const d=+s[pos];const names=['đơn vị','chục','trăm','nghìn','chục nghìn'];const hang=names[s.length-1-pos];const val=d*Math.pow(10,s.length-1-pos);

    return mc('so',`Trong số ${n}, chữ số ${d} ở hàng ${hang} có giá trị là:`,val,[d,d*10,d*100,d*1000,d*10000].filter(x=>x!==val).slice(0,2));},
  compare5(){return M.compare(1000,100000);},

  motPhan(){const k=rnd(2,9),n=rnd(2,9);return inp('nhanchia',`Tìm một phần ${k} của ${k*n}:`,n,{explain:`Muốn tìm một phần ${k} của một số, ta chia số đó cho ${k}: ${k*n} : ${k} = ${n}`});},
  mul3d(){const a=rnd(102,329),b=rnd(2,4);return inp('congtru','Đặt tính rồi tính:',a*b,{big:`${a} × ${b} = ?`,explain:`Nhân lần lượt từ hàng đơn vị, hàng chục đến hàng trăm, nhớ sang hàng bên trái khi tích vượt quá 9.`});},

  div3d(){const b=rnd(2,7);const n=rnd(31,120);const a=n*b;if(a>999)return M3.mul2d();return inp('congtru','Đặt tính rồi tính:',n,{big:`${a} : ${b} = ?`,explain:`Chia lần lượt từ hàng cao nhất: ${a} : ${b} = ${n}`});},
  bieuThuc(){const t=rnd(1,4);

  trungDiem(){const a=rnd(3,20)*2;return inp('doluong',`Đoạn thẳng AB dài ${a} cm. M là trung điểm của AB. Hỏi đoạn thẳng AM dài bao nhiêu xăng-ti-mét?`,a/2,{unit:'cm',icon:'📏',explain:`Trung điểm chia đoạn thẳng thành hai phần bằng nhau: ${a} : 2 = ${a/2} (cm)`});},
  hinhTron(){const r=rnd(3,20);return Math.random()<.5?inp('doluong',`Hình tròn tâm O có bán kính ${r} cm. Hỏi đường kính hình tròn đó dài bao nhiêu xăng-ti-mét?`,r*2,{unit:'cm',icon:'⭕',explain:`Đường kính gấp đôi bán kính: ${r} × 2 = ${r*2} (cm)`}):inp('doluong',`Hình tròn có đường kính ${r*2} cm. Hỏi bán kính hình tròn đó dài bao nhiêu xăng-ti-mét?`,r,{unit:'cm',icon:'⭕',explain:`Bán kính bằng một nửa đường kính: ${r*2} : 2 = ${r} (cm)`});},
  gocVuong(){const L=[['Hình chữ nhật có mấy góc vuông?','4'],['Hình vuông có mấy góc vuông?','4'],['Ê ke dùng để làm gì?','Kiểm tra góc vuông'],['Hình tam giác có ba góc, trong đó nhiều nhất có mấy góc vuông?','1']];const[q,a]=pick(L);

  doiDv3(){const L=[['1 cm','mm',10],['1 dm','cm',10],['1 m','cm',100],['1 m','mm',1000],['1 km','m',1000],['1 kg','g',1000],['1 l','ml',1000],['1 giờ','phút',60],['1 phút','giây',60],['1 ngày','giờ',24],['1 năm','tháng',12],['1 tuần','ngày',7]];

const TV3={
  word(w){const C={sv:['sự vật',SV3],hd:['hoạt động',HD3],dd:['đặc điểm',DD3]};const k=pick(Object.keys(C));
    if(Math.random()<.5){const ans=pick(C[k][1]);const o=Object.keys(C).filter(x=>x!==k).map(x=>pick(C[x][1]));return mc('tucau',`Từ nào là từ chỉ ${C[k][0]}?`,ans,o,{explain:`“${ans}” là từ chỉ ${C[k][0]}.`});}
    const wd=pick(C[k][1]);return mc('tucau',`Từ “${wd}” là từ chỉ gì?`,'Chỉ '+C[k][0],[],{fixed:['Chỉ sự vật','Chỉ hoạt động','Chỉ đặc điểm']});},
  cauType(){const t=rnd(0,3);const s=pick(CAU4[t][1]);return mc('tucau',`Câu “${s}” thuộc kiểu câu nào?`,CAU4[t][0],[],{fixed:CAU4.map(x=>x[0])});},
  cauPick(){const t=rnd(0,3);const ans=pick(CAU4[t][1]);const o=shuffle([0,1,2,3].filter(x=>x!==t)).slice(0,2).map(x=>pick(CAU4[x][1]));return mc('tucau',`Câu nào là ${CAU4[t][0].toLowerCase()}?`,ans,o);},
  soSanh(){if(Math.random()<.5){const[s,a,b]=pick(SS3);return mc('tucau',`Trong câu “${s}”, sự vật nào được dùng để so sánh?`,b,[a,'không có sự vật nào'],{explain:`Câu này so sánh ${a} với ${b}.`});}
    const[s]=pick(SS3);const o=shuffle(KHONGSS).slice(0,2);return mc('tucau','Câu nào có hình ảnh so sánh?',s,o,{explain:'Hình ảnh so sánh thường có các từ: như, tựa, là, giống như…'});},
  moRong(){const[s,part,q]=pick(MR3);return mc('tucau',`Trong câu “${s}”, bộ phận “${part}” trả lời cho câu hỏi nào?`,q,[],{fixed:['Khi nào?','Ở đâu?','Vì sao?','Để làm gì?']});},
  dauCau(){const[ok,wr,ex]=pick(DAU3);return mc('daucau','Câu nào dùng dấu câu đúng?',ok,wr,{explain:ex});},
  spell(w){const[wd,wr]=pick(SPELL3[w]);return mc('chinhta','Nghe đọc và chọn từ viết đúng chính tả:',wd,wr,{say:SAYCTX3[wd]||wd,visual:blankCtx(wd)});},
  arrange(){return ord('doanvan','Sắp xếp các từ ngữ thành câu đúng:',pick(ARR3));},
  paragraph(){return ord('doanvan','Sắp xếp các câu thành đoạn văn hợp lí:',pick(PARA3));},
  ending(){const[ok,wr]=pick(ENDS3);return mc('doanvan','Câu nào phù hợp để kết thúc đoạn văn (nêu tình cảm, cảm xúc)?',ok,wr,{explain:'Câu kết đoạn thường nêu tình cảm, cảm xúc hoặc mong ước của người viết.'});}
};
function blankCtx(wd){const s=SAYCTX3[wd];if(!s)return '';const i=s.toLowerCase().indexOf(wd);if(i<0)return '';return `<div class="ctx">${esc(s.slice(0,i))}<span class="blank">${'_'.repeat(6)}</span>${esc(s.slice(i+wd.length))}</div>`;}
const readQ3=(w,i)=>{const R=READ3[w];const[q,a,wr]=R.qs[i];return mc('dochieu',q,a,wr,{passage:R});};
const kpQ3=w=>{const[q,a,wr]=pick(KP3[w]);return mc('khampha',q,a,wr);};
function tv3Thunks(w,d){
  switch(d){
    case 0:return[()=>readQ3(w,0),()=>readQ3(w,1),()=>TV3.word(w)];
    case 1:return[()=>TV3.spell(w),()=>TV3.spell(w),()=>TV3.spell(w)];
    case 2:if(w===0)return[TV3.soSanh,TV3.soSanh,()=>TV3.word(w)];
      if(w===1)return[TV3.cauType,TV3.cauPick,()=>TV3.word(w)];
      if(w===2)return[TV3.cauType,TV3.cauType,TV3.cauPick];
      if(w===3)return[TV3.dauCau,TV3.dauCau,()=>TV3.word(w)];
      if(w===4)return[TV3.moRong,TV3.moRong,TV3.cauType];
      if(w===5)return[()=>TV3.word(w),TV3.cauType,TV3.dauCau];
      if(w===6)return[TV3.soSanh,TV3.moRong,TV3.cauType];
      return[TV3.cauType,TV3.moRong,TV3.dauCau];
    case 3:return[()=>readQ3(w,2),()=>readQ3(w,3),TV3.cauType];
    case 4:if(w<=2)return[TV3.arrange,TV3.arrange,TV3.cauPick];
      if(w<=4)return[TV3.arrange,TV3.dauCau,TV3.moRong];
      return[TV3.paragraph,TV3.ending,TV3.arrange];
    default:return[()=>TV3.spell(w),()=>TV3.word(w),TV3.cauType,()=>readQ3(w,rnd(0,3))];
  }
}

const ART_DK=(h,a=.22)=>{const n=parseInt(h.slice(1),16);const f=v=>Math.max(0,Math.round(v*(1-a)));return '#'+[n>>16,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('');};
const ART_LT=(h,a=.4)=>{const n=parseInt(h.slice(1),16);const f=v=>Math.round(v+(255-v)*a);return '#'+[n>>16,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('');};

const API_BASE='/api';

// Các tab cùng trình duyệt dùng chung 1 phiên (token trong localStorage): tab nào đăng nhập lại thì tab khác dùng theo
function syncTok(){const ls=localStorage.getItem('hv4_token')||'';if(ls&&ls!==TOKEN){TOKEN=ls;ROLE=localStorage.getItem('hv4_role')||ROLE;}}
async function apiCall(method,path,body,_retry){
  syncTok();const headers={'Content-Type':'application/json'};const usedTok=TOKEN;
  if(TOKEN)headers['Authorization']='Bearer '+TOKEN;
  let res;
  try{res=await fetch(API_BASE+path,{method,headers,body:body?JSON.stringify(body):undefined});}
  catch(e){throw new Error('Không kết nối được máy chủ. Kiểm tra mạng hoặc thử lại sau.');}
  let data={};try{data=await res.json();}catch(e){}
  if(res.status===401&&usedTok&&path!=='/auth/login'&&!_retry){syncTok();if(TOKEN&&TOKEN!==usedTok)return apiCall(method,path,body,true);}
  if(res.status===401&&usedTok&&usedTok===TOKEN&&path!=='/auth/login'){const o=data.other;forceLogout(data.code==='TRIAL_EXPIRED'?data.error:data.code!=='SESSION_REPLACED'?'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.':o?`Tài khoản này vừa đăng nhập trên thiết bị khác (${deviceName(o.device)}, lúc ${fmtTime(o.at)}) nên thiết bị này đã bị đăng xuất.`:'Phiên đăng nhập đã kết thúc (do cập nhật ứng dụng, đã đăng xuất, hoặc quản trị viên đặt lại mật khẩu). Vui lòng đăng nhập lại.');}
  if(!res.ok)throw new Error((data.error||'Có lỗi xảy ra, thử lại nhé.')+(data.detail?' ('+data.detail+')':''));
  return data;
}

let rewardsLoading=null;
async function ensureRewardsData(){
  if(!TOKEN||ROLE!=='student')return;
  if(S._rewardsLoaded)return;
  if(rewardsLoading)return rewardsLoading;
  rewardsLoading=apiGet('/student/me/rewards').then(data=>{
    const srvSt=Array.isArray(data.stickers)?data.stickers:[];
    S.stickers=[...new Set(srvSt.concat(mathEarned()))];
    S.shop=Array.isArray(data.shop)?data.shop:[];
    S.coins=Number(data.coins)||0;
    // Sticker Xe cộ: lấy từ máy chủ (đã gộp cả các bài English đạt sao) + bài đạt sao trên máy này
    const srv=Array.isArray(data.en_stickers)?data.en_stickers.map(Number):[];
    const mine=enEarned();const all=[...new Set(srv.concat(mine))].sort((a,b)=>a-b);
    S.enSt=all;S._rewardsLoaded=true;
    save();
    if(all.length>srv.length||S.stickers.length>srvSt.length)syncRewards();
  }).catch(()=>{}).finally(()=>{rewardsLoading=null;});
  return rewardsLoading;
}

async function hydrateStudentHome(){HOME_ERR='';
  try{
    const data=await apiGet('/student/me/home');
    S.studentId=data.student.id;
    S.name=data.student.name;
    S.avatar=data.student.avatar;
    S.gift=data.student.gender;
    S.joinCode=data.student.join_code;
    S.totalPoints=Number(data.student.total_points)||0;

    S.stars={};enStars().stars={};tvStars().stars={};S.pass={};S.lastPts={};exS().stars={};
    (data.progress||[]).forEach(p=>{
      S.lastPts[p.level_key]=Number(p.points)||0;markPass(p.level_key,Number(p.best!=null?p.best:p.stars)||0);
      if(p.level_key.startsWith('main_'))S.stars[+p.level_key.slice(5)]=p.stars;
      else if(p.level_key.startsWith('en_'))enStars().stars[+p.level_key.slice(3)]=p.stars;
      else if(p.level_key.startsWith('tv_'))tvStars().stars[+p.level_key.slice(3)]=p.stars;
      else if(p.level_key.startsWith('exam_')){exS().stars[p.level_key.slice(5)]=p.stars;}
    });
    S.bestPts={};(data.progress||[]).forEach(p=>{S.bestPts[p.level_key]=Number(p.bp!=null?p.bp:p.points)||0;});
    mergeSpeak(data.speak||{});

    const today=todayStr();
    S.days[today]=S.days[today]||{n:0,sec:0};
    S.days[today].sec=Number(data.today_seconds)||0;
    S.coins=Number(data.coins)||0;
    S.enSt=enEarned();
    S._rewardsLoaded=false;
    save();
    return true;
  }catch(e){
    /* Mất mạng: tiếp tục dùng cache cục bộ để giao diện vẫn mở ngay. */
    HOME_ERR=e&&e.message||'';
    return false;
  }
}

function courseTotals(){const t={main:48,tv:48,en:48,exam:0,spk:0};
  try{t.main=WEEKS.length*6;}catch(e){}
  try{t.tv=TV_UNITS.length*3;}catch(e){}
  try{t.en=EN_N;}catch(e){}
  try{t.exam=Object.keys(EXAM_SUBJ).reduce((a,k)=>a+EXAM_SUBJ[k].list().length,0);}catch(e){}
  try{t.spk=SPK.length;}catch(e){}
  t.stars=(t.main+t.tv+t.en)*3;return t;}
function keySubj(k){return /^(main_|exam_toan_|speed$)/.test(k)?'toan':/^(tv_|exam_tv_)/.test(k)?'tv':'en';}
const SUBJ_N={toan:'Toán',tv:'Tiếng Việt',en:'English'};
function skillSubj(s){return s.startsWith('en_')?'en':TOAN.includes(s)?'toan':'tv';}
function levelName(k){try{let m;
  if((m=/^main_(\d+)$/.exec(k))){const i=+m[1],w=Math.floor(i/6),d=i%6;return `Toán · Chặng ${w+1}: ${WEEKS[w].t} · ${LEVEL_INFO[d].n}`;}
  if((m=/^tv_(\d+)$/.exec(k))){const i=+m[1],u=Math.floor(i/3),U=TV_UNITS[u];return `Tiếng Việt · ${U.lab?U.lab+': ':''}${U.t} · ${TV_LV[i%3].n}`;}
  if((m=/^en_(\d+)$/.exec(k))){const i=+m[1],u=Math.floor(i/3),U=EN_UNITS[u];return `English · ${U.lab||('Unit '+(u+1))}: ${U.t} · ${EN_LV[i%3].n}`;}
  if((m=/^exam_([a-z]+)_(\d+)$/.exec(k))){const E=EXAM_SUBJ[m[1]];return `Luyện đề ${E.n} · ${E.list()[+m[2]].t}`;}
  if((m=/^spk_(\d+)$/.exec(k))){const P=SPK[+m[1]];return `Luyện nói · ${P&&(P.t||P.title)||('Bài '+(+m[1]+1))}`;}
  if(k==='speed')return 'Tính nhẩm 60 giây';}catch(e){}return k;}
function starTxt(n,max){max=max||3;n=Math.max(0,Math.min(max,n||0));return '★'.repeat(n)+'☆'.repeat(max-n);}
function pctBar(c,t){const p=t?Math.round(c/t*100):0;return `<div class="goal-bar"><i class="${p<60?'low':p<80?'mid':''}" style="width:${p}%"></i></div>`;}

  const exDone=P.filter(p=>/^exam_/.test(p.level_key)).length,spDone=cnt(/^spk_/);

  <div class="stat"><b>${cnt(/^main_/)}/${T.main}</b><small>bài Toán đã qua</small></div><div class="stat"><b>${cnt(/^tv_/)}/${T.tv}</b><small>bài Tiếng Việt đã qua</small></div>

  ${T.spk?`<div class="stat"><b>🗣️ ${spDone}/${T.spk}</b><small>bài luyện nói đã xong</small></div>`:''}<div class="stat"><b>⏱️ ${wkMin} phút</b><small>học ${wkDays}/7 ngày qua</small></div></div>

let CLIPS=null;

function ensureClips(){
  if(CLIPS)return Promise.resolve(CLIPS);
  if(CLIPS_LOADING)return CLIPS_LOADING;
  // Đọc + giải mã 8MB JSON/base64 trong Web Worker để không làm đơ luồng chính (iPhone chạm bị trễ). Không có Worker thì làm như cũ.
  const mainThread=()=>fetch('./voice-data.json').then(r=>r.ok?r.json():{}).then(d=>{CLIPS=new Map();Object.keys(d).forEach(k=>CLIPS.set(k,d[k]));return CLIPS;}).catch(()=>{CLIPS=new Map();return CLIPS;});
  CLIPS_LOADING=new Promise(res=>{
    let w=null,url=null;
    const done=m=>{try{if(w)w.terminate();}catch(e){}try{if(url)URL.revokeObjectURL(url);}catch(e){}res(m);};
    try{
      url=URL.createObjectURL(new Blob(['self.onmessage=async e=>{try{const r=await fetch(e.data);if(!r.ok)throw 0;const d=await r.json(),o={},t=[];for(const k in d){const s=atob(d[k]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);o[k]=u.buffer;t.push(u.buffer);}self.postMessage(o,t);}catch(x){self.postMessage(null);}};'],{type:'text/javascript'}));
      w=new Worker(url);
      w.onmessage=e=>{if(e.data){CLIPS=new Map(Object.entries(e.data));done(CLIPS);}else{if(w){w.terminate();w=null;}mainThread().then(done);}};
      w.onerror=()=>{if(w){w.terminate();w=null;}mainThread().then(done);};
      w.postMessage(new URL('./voice-data.json',location.href).href);
    }catch(e){mainThread().then(done);}
  });
  return CLIPS_LOADING;
}

function shapeSVG(k,c){const a=`fill="${c}" stroke="rgba(0,0,0,.25)" stroke-width="3"`;const b=k==='vuong'?`<rect x="12" y="12" width="56" height="56" rx="3" ${a}/>`:k==='tron'?`<circle cx="40" cy="40" r="30" ${a}/>`:k==='tamgiac'?`<polygon points="40,8 74,70 6,70" ${a} stroke-linejoin="round"/>`:`<rect x="4" y="20" width="72" height="40" rx="3" ${a}/>`;return `<svg viewBox="0 0 80 80" width="72" height="72" aria-hidden="true">${b}</svg>`;}
function blockSVG(k,sz){sz=sz||70;const w=k==='cube'?36:56,h=36,d=16,x=8,y=8+d;const f='#60A5FA',t='#BFDBFE',r='#2563EB';const W=x+w+d+8,H=y+h+8;return `<svg viewBox="0 0 ${W} ${H}" height="${sz}" aria-hidden="true"><polygon points="${x},${y} ${x+d},${y-d} ${x+w+d},${y-d} ${x+w},${y}" fill="${k==='cube'?'#FDE68A':t}" stroke="#334155" stroke-width="1.5"/><polygon points="${x+w},${y} ${x+w+d},${y-d} ${x+w+d},${y+h-d} ${x+w},${y+h}" fill="${k==='cube'?'#F59E0B':r}" stroke="#334155" stroke-width="1.5"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${k==='cube'?'#FCD34D':f}" stroke="#334155" stroke-width="1.5"/></svg>`;}
function rulerSVG(len,item){const u=26,x0=16,max=Math.max(10,len+2),W=x0*2+max*u;const col={pencil:'#F59E0B',crayon:'#E11D48',ribbon:'#7C5CF0'}[item]||'#16A34A';const L=len*u;let obj;if(item==='pencil')obj=`<rect x="${x0}" y="14" width="${L-18}" height="18" fill="${col}" stroke="#92400E" stroke-width="1.5"/><polygon points="${x0+L-18},14 ${x0+L},23 ${x0+L-18},32" fill="#FDE68A" stroke="#92400E" stroke-width="1.5"/><rect x="${x0}" y="14" width="10" height="18" fill="#F9A8D4"/>`;else if(item==='crayon')obj=`<rect x="${x0}" y="13" width="${L-12}" height="20" rx="4" fill="${col}"/><polygon points="${x0+L-12},15 ${x0+L},23 ${x0+L-12},31" fill="${col}"/><rect x="${x0+8}" y="13" width="${Math.max(6,L-40)}" height="20" fill="rgba(255,255,255,.35)"/>`;else obj=`<rect x="${x0}" y="16" width="${L}" height="14" rx="3" fill="${col}"/>`;let t='';for(let k=0;k<=max;k++){const x=x0+k*u;t+=`<line x1="${x}" y1="44" x2="${x}" y2="58" stroke="#334155" stroke-width="2"/><text x="${x}" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">${k}</text>`;if(k<max)t+=`<line x1="${x+u/2}" y1="44" x2="${x+u/2}" y2="51" stroke="#334155" stroke-width="1.2"/>`;}return `<svg class="ruler" viewBox="0 0 ${W} 84" aria-hidden="true">${obj}<line x1="${x0}" y1="8" x2="${x0}" y2="44" stroke="#94A3B8" stroke-dasharray="3 3"/><rect x="2" y="40" width="${W-4}" height="42" rx="6" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/>${t}</svg>`;}
function noVoiceHint(q){if(!(q.say||q.auto)||voiceMode()!=='none')return '';const t=q.say||(q.voice||[]).filter(v=>v[0]==='en').map(v=>v[1]).join(' ');return t?`<div class="novoice">🔇 Máy chưa có giọng đọc. Bố mẹ đọc giúp con: <b>${esc(t)}</b></div>`:'';}
function extraVis(q){let h='';if(q.shapes)h+=`<div class="shp">${q.shapes.map(s=>`<figure>${shapeSVG(s[0],s[1])}${s[2]?`<figcaption>${esc(s[2])}</figcaption>`:''}</figure>`).join('')}</div>`;if(q.block)h+=`<div class="shp">${blockSVG(q.block,110)}</div>`;if(q.blocks)h+=`<div class="shp">${q.blocks.map(b=>blockSVG(b,64)).join('')}</div>`;if(q.ruler)h+=`<div class="rulerwrap">${rulerSVG(q.ruler[0],q.ruler[1])}</div>`;if(q.clock)h+=`<div class="clockwrap">${clockSVG(q.clock[0],q.clock[1])}</div>`;return h;}

let Q=null;
function startLevel(i){const w=Math.floor(i/6),d=i%6;Q={level:i,qs:buildLevel(w,d),i:0,correct:0,coins:0,start:Date.now()};renderQ();}
function renderQ(){
  const q=Q.qs[Q.i];stopVoice();if(q.type==='mc'&&!q.fixed&&!q._sh){q.options=shuffle(q.options);q._sh=1;}Q.sel=null;Q.typed='';Q.placed=[];Q.locked=false;
  const sj=subjOf(q.skill);
  let big='';if(q.big){big=qH(q,q.big);if(q.type==='input')big=big.replace('?','<span class="slot" id="slot">?</span>');else big=big.replace('☐','<span class="slot" id="slot">&nbsp;</span>');}
  app.innerHTML=`<div class="quiz"><div class="qtop"><button class="icon-btn" id="quit" aria-label="Thoát bài">✕</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.qs.length}" aria-valuenow="${Q.i}"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><span class="qcount">${Q.i+1}/${Q.qs.length}</span></div>
  <div class="qbody"><div class="qhead"><span class="tag tag-${sj.k}">${q.secLab||sj.n}</span>${q.hard?`<span class="tag tag-hard">⭐ ${sj.k==='en'?'Challenge':'Thử thách'}</span>`:''}<button class="icon-btn" id="speakQ" aria-label="Đọc to câu hỏi">🔊</button></div>
  ${q.passage?`<details class="passage" open><summary>📄 ${esc(q.passage.title)}</summary><p>${esc(q.passage.text)}</p><button class="say-btn" id="sayP">🔊 Nghe đọc bài</button></details>`:''}
  <div class="prompt">${q.icon?`<span class="picon" aria-hidden="true">${q.icon}</span>`:''}${qH(q,q.prompt)}</div>
  ${q.big?`<div class="big"${q.bigSmall?' style="font-size:30px"':''}>${big}</div>`:''}${q.visual||''}${extraVis(q)}${noVoiceHint(q)}
  ${q.say||q.auto?`<button class="say-btn large" id="sayW">🔊 ${q.auto?'Nghe lại':'Nghe đọc'}</button>`:''}
  <div id="ans"></div></div>
  <div class="qfoot"><div id="padwrap"></div><button class="btn btn-go" id="check" disabled>Kiểm tra</button></div>
  <div class="sheet" id="sheet" aria-live="polite"></div></div>`;
  $('#quit').onclick=confirmQuit;$('#speakQ').onclick=()=>speakQ(q);
  if(q.passage)$('#sayP').onclick=()=>speakPassage(q.passage);
  if(q.say||q.auto)$('#sayW').onclick=()=>speakQ(q);
  const newP=q.passage&&Q._pTitle!==q.passage.title;if(q.passage)Q._pTitle=q.passage.title;
  if(S.autoRead!==false||q.say||q.auto)setTimeout(()=>{if(Q&&Q.qs[Q.i]===q&&!Q.locked)speakQ(q,true,newP);},450);
  if(S.autoRead!==false||q.say||q.auto)ttsPrefetch(newP&&q.passage?passSegs(q.passage).concat(qSegs(q)):qSegs(q));
  {const cq=Q;setTimeout(()=>{if(Q!==cq||cq.qs[cq.i]!==q)return;[cq.qs[cq.i+1],cq.qs[cq.i+2]].forEach(n=>{if(n)ttsPrefetch(qSegs(n));});},120);}
  if(!q.voice&&voiceMode()==='none')app.querySelectorAll('#speakQ,#sayW,#sayP').forEach(b=>b.classList.add('muted'));
  $('#check').onclick=check;renderAnswer(q);
}
const fmtNum=v=>{v=String(v);return /^\d{4,}$/.test(v)?v.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0'):v;};
const frH=h=>String(h).replace(/(\d+|\?)\/(\d+|\?)/g,'<span class="fr"><b>$1</b><b>$2</b></span>');
const qH=(q,t)=>q&&q.skill==='phanso'?frH(esc(t)):esc(t);
function setSlot(v){const s=$('#slot');if(s){s.innerHTML=v?frH(esc(fmtNum(v))):'?';s.classList.toggle('filled',!!v);}}
function keypadHTML(){return `<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}<button class="key fn" data-k="C" aria-label="Xóa hết">Xóa</button><button class="key" data-k="0">0</button><button class="key fn" data-k="B" aria-label="Xóa một số">⌫</button></div>`;}
function typeKey(k,onChange){if(k==='B')Q.typed=Q.typed.slice(0,-1);else if(k==='C')Q.typed='';else if(Q.typed.length<9)Q.typed=(Q.typed==='0'?'':Q.typed)+k;sfx.tap();onChange();}
function renderAnswer(q){
  const ans=$('#ans');
  if(q.type==='mc'){const short=q.options.every(o=>o.length<=3)||q.emo;ans.innerHTML=`<div class="opts${short?' short':''}${q.emo?' emo-opts':''}${q.emoGrp?' grp-opts':''}">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${qH(q,o)}</button>`).join('')}</div>`;
    ans.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.locked)return;sfx.tap();ans.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');Q.sel=q.options[+b.dataset.k];if(q.big&&q.big.includes('☐'))setSlot(Q.sel);$('#check').disabled=false;});}
  else if(q.type==='speak')renderSpeakAns(q);
  else if(q.type==='input'){if(!(q.big&&q.big.includes('?')))ans.innerHTML=`<div class="inputbox"><span class="slot" id="slot">?</span>${q.unit?`<span class="unit">${esc(q.unit)}</span>`:''}</div>`;
    $('#padwrap').innerHTML=keypadHTML();$('#padwrap').querySelectorAll('.key').forEach(b=>b.onclick=()=>{if(Q.locked)return;typeKey(b.dataset.k,()=>{setSlot(Q.typed);$('#check').disabled=!Q.typed;});});}
  else{Q.placed=[];ans.innerHTML=`<div class="line" id="line"></div><div class="pool" id="pool"></div>`;drawOrder(q);}
}
function drawOrder(q){
  const long=q.items.some(t=>t.length>22);const line=$('#line'),pool=$('#pool');
  line.innerHTML=Q.placed.length?Q.placed.map(k=>`<button class="chip${long?' long':''}" data-k="${k}">${esc(q.items[k])}</button>`).join(''):'<span class="line-hint">Chạm vào từng ô bên dưới để xếp vào đây</span>';
  pool.innerHTML=q.items.map((t,k)=>`<button class="chip${long?' long':''}${Q.placed.includes(k)?' ghost':''}" data-k="${k}" ${Q.placed.includes(k)?'tabindex="-1" aria-hidden="true"':''}>${esc(t)}</button>`).join('');
  line.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(Q.locked)return;sfx.tap();Q.placed=Q.placed.filter(x=>x!==+b.dataset.k);drawOrder(q);});
  pool.querySelectorAll('.chip:not(.ghost)').forEach(b=>b.onclick=()=>{if(Q.locked)return;sfx.tap();Q.placed.push(+b.dataset.k);drawOrder(q);});
  $('#check').disabled=Q.placed.length!==q.items.length;
}
const ansText=q=>q.type==='order'?q.answer.join(q.skill==='so'?', ':' '):q.type==='input'?fmtNum(q.answer)+(q.unit?' '+q.unit:''):q.answer;
function check(){
  const q=Q.qs[Q.i];if(Q.locked)return;stopVoice();let ok;
  stopRec();if(q.type==='speak')ok=!!Q.spkRes&&!Q.spkRes.skip&&(Q.spkRes.noScore||Q.spkRes.stars>=3);else if(q.type==='mc')ok=Q.sel===q.answer;else if(q.type==='input')ok=Number(Q.typed)===q.answer&&Q.typed!=='';else ok=Q.placed.map(k=>q.items[k]).join('|')===q.answer.join('|');
  Q.locked=true;stat(q.skill,ok);if(q.sec){Q.secs=Q.secs||{};const _s=Q.secs[q.sec]||(Q.secs[q.sec]={c:0,t:0});_s.t++;if(ok)_s.c++;}
  Q.skillDelta=Q.skillDelta||{};const _sd=Q.skillDelta[q.skill]||(Q.skillDelta[q.skill]={c:0,t:0});_sd.t++;if(ok)_sd.c++;
  if(q.type==='mc')document.querySelectorAll('.opt').forEach(b=>{const v=q.options[+b.dataset.k];if(v===q.answer)b.classList.add('right');else if(b.classList.contains('sel'))b.classList.add('wrong');});
  if(ok){Q.correct++;Q.coins+=2;sfx.ok();setTimeout(sfx.coin,250);}else sfx.bad();
  const sh=$('#sheet');sh.className='sheet show '+(ok?'good':'bad');

function podiumHTML(list){const top=list.slice(0,3);if(!top.length)return '';const ord=[1,0,2].filter(i=>top[i]);const med=['🥇','🥈','🥉'];
  return `<div class="podium">${ord.map(i=>{const k=top[i];return `<div class="pd pd${i+1}${k.me?' pd-me':''}"><div class="pd-ava">${esc(k.avatar||'🙂')}</div><div class="pd-name">${esc(k.name)}${k.me?' <small>(con)</small>':''}</div><div class="pd-pts">🏅 ${Number(k.total_points)||0}</div><div class="pd-block">${med[i]}<b>${i+1}</b></div></div>`;}).join('')}</div>`;}
function rankList(list,from){const medal=['🥇','🥈','🥉'];from=from||0;return `<ol class="rank">${list.map((k,r)=>{const n=from+r;return `<li class="${k.me?'me-row':''}"><span class="rk">${medal[n]||n+1}</span><span class="ra">${esc(k.avatar||'🙂')}</span><span class="rn">${esc(k.name)}${k.me?' <small>(con)</small>':''}</span><span class="rs">🏅 ${Number(k.total_points)||0} <small>⭐ ${k.total_stars||0} · ${k.completed_levels||0} bài</small></span></li>`;}).join('')}</ol>`;}
function classBoardHTML(list,opt){opt=opt||{};if(!list.length)return `<div class="card empty"><div class="big-ic">🏆</div><h2>Chưa có dữ liệu xếp hạng</h2><p>Hãy hoàn thành ít nhất một bài để có tên trên bảng xếp hạng.</p></div>`;
  const me=list.find(k=>k.me);const idx=me?list.indexOf(me):-1;
  return `<div class="card rank-card"><h2>🏆 Bảng xếp hạng cả lớp</h2><p class="lead" style="margin:0 0 6px">${list.length} bạn · xếp theo <b>điểm tích lũy</b>, bằng điểm thì xét số sao và số bài.</p>${podiumHTML(list)}${list.length>3?rankList(list.slice(3),3):''}
  ${me&&opt.meCard!==false?`<div class="me-rank">Con đang đứng <b>thứ ${idx+1}</b> / ${list.length}${idx>0?` · cần thêm <b>${Math.max(1,(Number(list[idx-1].total_points)||0)-(Number(me.total_points)||0)+1)} điểm</b> để vượt bạn ${esc(list[idx-1].name)}`:' · Con đang dẫn đầu cả lớp! 🎉'}</div>`:''}
  ${opt.reload!==false?'<button class="btn btn-soft" id="rkReload">🔄 Cập nhật bảng xếp hạng</button>':''}</div>`;}

function shopPane(){let h=`<div class="card shop-top"><h2>🪙 Con đang có ${S.coins} xu</h2><p class="lead" style="margin:0">Làm bài và thắng mini game để kiếm thêm xu, rồi đổi lấy những món con thích. Cửa hàng ưu tiên bộ sticker theo giới tính của con và vẫn có các món dành cho tất cả.</p></div>`;
  shopOrder().forEach(g=>{const items=SHOP.map((s,i)=>({s,i})).filter(x=>x.s.g===g&&shopEligible(x.s));const have=items.filter(x=>(S.shop||[]).includes(x.i)).length;

async function buyItem(i){if(TOKEN&&ROLE==='student'&&!S._rewardsLoaded)await ensureRewardsData();const s=SHOP[i];if((S.shop||[]).includes(i))return;
  if(S.coins<s.p){sfx.bad();toast(`Con cần thêm ${s.p-S.coins} xu nữa để đổi ${s.n}. Cố lên nhé!`);return;}
  const m=modal(`${stickerHTML(s,'xl')}<h2>Đổi ${esc(s.n)}?</h2><p>Con sẽ dùng <b>🪙 ${s.p}</b> trong ${S.coins} xu đang có.</p><button class="btn btn-go" id="byY">Đổi ngay</button><button class="btn btn-soft" id="byN">Để dành thêm</button>`);
  m.querySelector('#byN').onclick=()=>m.remove();
  m.querySelector('#byY').onclick=()=>{S.coins-=s.p;S.shop=(S.shop||[]).concat([i]);save();syncRewards();m.remove();sfx.win();confetti();renderAchieve('shop');setTimeout(()=>zoomSticker('shop',i),200);};}

  app.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.zoom.split(':');zoomSticker(k,+i);});

  if(tab==='rank'&&$('#rkReload'))$('#rkReload').onclick=()=>{sfx.tap();renderAchieve('rank',{force:true});};

async function renderAchieve(tab,opt){opt=opt||{};Q=null;stopSpeed();stopVoice();ACH_TAB=tab;
  let p=null;
  if(TOKEN&&ROLE==='student'){
    if(tab==='rank'){if(opt.force||!(S.rank||[]).length||Date.now()-RANK_AT>60000)p=refreshStudentRank();}
    else if(!S._rewardsLoaded)p=ensureRewardsData();
  }
  drawAchieve(tab,false);
  if(!p)return;
  const before=achSig(tab);
  await p;
  if(ACH_TAB===tab&&app.querySelector('.ach-page')&&achSig(tab)!==before)drawAchieve(tab,true);}

async function boot(){
  if(!TOKEN||!ROLE){renderRoleGate();return;}
  if(ROLE==='admin'){renderAdminPortal();return;}
  // Máy còn lưu vai trò phụ huynh cũ → máy chủ đã chuyển tài khoản thành học sinh
  if(ROLE==='parent'){ROLE='student';try{localStorage.setItem('hv4_role','student');}catch(e){}S.name='';save();}

  // Hiển thị ngay từ cache; Neon chỉ đồng bộ dữ liệu trang chủ ở background.
  if(S.name){
    renderHome();
    refreshHomeInBackground();
  }else{
    // Lần đầu trên thiết bị này: cần 1 request tối thiểu để biết hồ sơ.
    const ok=await hydrateStudentHome();

  }

const fmtN=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');

const mc4=(skill,prompt,answer,wrong,extra)=>{const w=[...new Set(wrong.map(String))].filter(x=>x!==String(answer)).slice(0,3);return mc(skill,prompt,answer,w,extra);};

const digitsWrong=n=>{const s=String(n);const out=new Set();for(let i=0;i<s.length-1;i++){const a=s.split('');[a[i],a[i+1]]=[a[i+1],a[i]];if(a[0]!=='0')out.add(+a.join(''));}return[...out].filter(x=>x!==n);};

/* Đề Toán lớp 4 (Kết nối tri thức) — theo ma trận đề cuối học kì II: M1 nhận biết · M2 thông hiểu · tự luận · M3 vận dụng */
function read3(n,full){if(!full)return readNum(n);const h=Math.floor(n/100),r=n%100;let s=(h===0?'không':readNum(h))+' trăm';if(r===0)return s;if(r<10)return s+' linh '+readNum(r);return s+' '+readTens(r);}
function readBig(n){if(n<1000)return readNum(n);const g=[];let x=n;while(x>0){g.unshift(x%1000);x=Math.floor(x/1000);}const nm=['','nghìn','triệu','tỉ'];let out=[];g.forEach((v,i)=>{const lv=nm[g.length-1-i];if(v===0)return;out.push(read3(v,i>0)+(lv?' '+lv:''));});return out.join(' ');}
const gcd=(a,b)=>b?gcd(b,a%b):a;
const fr=(a,b)=>`${a}/${b}`;
const frR=(a,b)=>{const g=gcd(a,b);return b/g===1?String(a/g):fr(a/g,b/g);};
const EXM={
  docSo(){const n=rnd(1,99)*1000000+rnd(0,999)*1000+rnd(0,999);return mc4('so',`Số ${fmtN(n)} đọc là:`,readBig(n),[n+1000000,n-n%1000000+((n%1000000)*10)%1000000,Number(String(n).slice(0,-1)+'0')].filter(x=>x!==n).map(readBig));},
  giaTri(){const n=rnd(1000000,99999999);const s=String(n);let p=rnd(0,s.length-4);while(s[p]==='0')p++;const d=+s[p];const v=d*Math.pow(10,s.length-1-p);const hang=['đơn vị','chục','trăm','nghìn','chục nghìn','trăm nghìn','triệu','chục triệu'][s.length-1-p];return mc4('so',`Chữ số ${d} trong số ${fmtN(n)} thuộc hàng nào?`,`Hàng ${hang}`,['Hàng nghìn','Hàng trăm nghìn','Hàng triệu','Hàng chục nghìn','Hàng chục triệu'].filter(x=>x!==`Hàng ${hang}`).slice(0,3),{explain:`Chữ số ${d} có giá trị ${fmtN(v)}.`});},

  chanLe(){const L=[['Số nào là số chẵn?',String(rnd(100,999)*2),[String(rnd(100,999)*2+1),String(rnd(100,999)*2+1)]],['Số nào là số lẻ?',String(rnd(100,999)*2+1),[String(rnd(100,999)*2),String(rnd(100,999)*2)]]];const[q,a,w]=pick(L);return mc('so',q,a,w,{explain:'Số chẵn có chữ số tận cùng 0, 2, 4, 6, 8; số lẻ có chữ số tận cùng 1, 3, 5, 7, 9.'});},
  beLon(){const b=rnd(100000,900000);const s=new Set([b,b+rnd(1,9)*1000,b-rnd(1,9)*10,b+rnd(1,9)*100000]);while(s.size<4)s.add(rnd(100000,999999));const L=[...s].slice(0,4);const big=Math.random()<.5;const a=big?Math.max(...L):Math.min(...L);return mc('so',`Số ${big?'lớn':'bé'} nhất trong các số ${L.map(fmtN).join('; ')} là:`,fmtN(a),L.filter(x=>x!==a).map(fmtN));},
  phanSoDoc(){const b=rnd(3,12),a=rnd(1,b-1);return mc4('phanso',`Phân số ${fr(a,b)} đọc là:`,`${readNum(a)} phần ${readNum(b)}`,[`${readNum(b)} phần ${readNum(a)}`,`${readNum(a)} chia ${readNum(b)}`,`${readNum(a)} và ${readNum(b)}`]);},
